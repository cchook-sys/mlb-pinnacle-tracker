<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b1120; color: #a1a1aa; font-family: 'Segoe UI', sans-serif; }
        .panel { background-color: #162033; border: 1px solid #2d3748; }
        .game-active { border: 1px solid #0ea5e9; box-shadow: 0 0 10px rgba(14, 165, 233, 0.2); }
    </style>
</head>
<body class="p-2 h-screen flex flex-col font-mono text-[11px]">
    <header class="flex justify-between items-center px-4 py-2 border-b border-slate-700 bg-[#0f172a] mb-2">
        <h1 class="font-bold text-white text-sm tracking-widest">MLB PINNACLE TRACKER</h1>
        <div id="status" class="text-sky-400 text-xs">更新: 16:16:44</div>
    </header>

    <main class="grid grid-cols-12 gap-2 flex-grow overflow-hidden">
        <div id="games-list" class="col-span-4 overflow-y-auto space-y-2 pr-1"></div>
        
        <div class="col-span-8 flex flex-col gap-2">
            <div class="panel p-4 flex-grow relative"><canvas id="oddsChart"></canvas></div>
            <div class="panel p-3 text-white" id="odds-details">
                <div class="text-slate-500 font-bold mb-1">盤口詳情:</div>
                <div id="details-text">請點擊左側賽事</div>
            </div>
        </div>
    </main>

    <script>
        let myChart;
        async function fetchGames() {
            const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
            const json = await res.json();
            
            document.getElementById('games-list').innerHTML = json.data.map((g, i) => `
                <div onclick="selectGame(${i})" class="panel p-3 cursor-pointer hover:border-sky-500 transition-all">
                    <div class="text-white font-bold mb-1">${g.away_team} VS ${g.home_team}</div>
                    <div class="flex justify-between text-[10px]">
                        <span>${new Date(g.commence_time).getMonth()+1}/${new Date(g.commence_time).getDate()} ${new Date(g.commence_time).getHours()}:${new Date(g.commence_time).getMinutes()}</span>
                        <span class="text-amber-400">獨贏: ${g.bookmakers[0].markets[0].outcomes[0].price}</span>
                        <span class="bg-rose-700 text-white px-2 rounded">進場</span>
                    </div>
                </div>
            `).join('');
        }
        
        // 此處對接圖表繪製邏輯
        function selectGame(i) {
            // ... (繪圖與數據綁定邏輯)
        }
        fetchGames();
    </script>
</body>
</html>
