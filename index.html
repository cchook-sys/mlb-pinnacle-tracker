<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Pinnacle 智能量化儀表板</title>
    <style>
        :root { --bg:#0b1120; --card:#1e293b; --accent:#38bdf8; --text:#f1f5f9; --border:#334155; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* 側邊欄 */
        #glist { width: 400px; border-right: 1px solid var(--border); overflow-y: auto; padding: 20px; }
        .game-card { background: var(--card); border: 2px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .game-card:hover { border-color: var(--accent); }
        
        /* 右側面板 */
        #dpanel { flex: 1; padding: 40px; display: flex; align-items: center; justify-content: center; }
        .dashboard-ui { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; }
        
        .status-tag { background: #064e3b; color: #34d399; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>

<div id="glist">
    <div style="font-size:20px; font-weight:800; margin-bottom:20px;">⚾ MLB Pinnacle 智能量化儀表板</div>
    <div id="game-list-content">載入中...</div>
</div>

<div id="dpanel">
    <div style="text-align:center; color:#64748b;">請點擊左側場次查看詳細數據</div>
</div>

<script>
const API = 'https://mlb-pinnacle-tracker.onrender.com';
let games = [];

async function fetchData() {
    try {
        // 加入時間戳記避免快取
        const r = await fetch(`${API}/games?t=${Date.now()}`, { mode: 'cors' });
        games = await r.json();
        const list = document.getElementById('game-list-content');
        list.innerHTML = games.map(g => `
            <div class="game-card" onclick="selectGame('${g.game_id}')">
                <div style="font-weight:700; margin-bottom:8px;">${g.away} 客 VS ${g.home} 主</div>
                <div style="display:flex; gap:15px; font-size:13px; color:#94a3b8;">
                    <div>大小分: <span style="color:var(--accent)">${g.latest?.total ?? '--'}</span></div>
                    <div>獨贏: <span style="color:#f87171">${g.latest?.ml_home ?? '--'}</span></div>
                </div>
            </div>
        `).join('');
    } catch(e) { document.getElementById('game-list-content').innerHTML = "連線失敗"; }
}

function selectGame(id) {
    const g = games.find(g => g.game_id === id);
    if (!g) return;
    document.getElementById('dpanel').innerHTML = `
        <div class="dashboard-ui">
            <h2 style="margin-bottom:20px;">${g.away} VS ${g.home}</h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                <div style="background:#0f172a; padding:15px; border-radius:10px;">
                    <div style="color:#94a3b8; font-size:12px;">目前總分</div>
                    <div style="font-size:28px; font-weight:800;">${g.latest?.total ?? '--'}</div>
                </div>
                <div style="background:#0f172a; padding:15px; border-radius:10px;">
                    <div style="color:#94a3b8; font-size:12px;">開盤總分</div>
                    <div style="font-size:28px; font-weight:800; color:#475569;">${g.open?.total ?? '--'}</div>
                </div>
                <div style="color:#f97316;">Over 賠率: ${g.latest?.over_juice ?? '--'}</div>
                <div style="color:var(--accent);">Under 賠率: ${g.latest?.under_juice ?? '--'}</div>
            </div>
        </div>
    `;
}

window.onload = fetchData;
</script>
</body>
</html>
