<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-4 h-screen flex flex-col">
    <header class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h1 class="text-xl font-bold text-white">⚾ MLB PINNACLE TRACKER</h1>
        <div id="status" class="text-sm font-mono text-sky-400">系統連接中...</div>
    </header>

    <main class="flex-grow grid grid-cols-4 gap-4 overflow-hidden">
        <div id="games-list" class="col-span-1 overflow-y-auto space-y-2 pr-2"></div>
        <div class="col-span-3 flex flex-col gap-4">
            <div class="card p-6 h-full flex flex-col">
                <h2 id="game-title" class="text-xl font-bold mb-4">請選擇比賽</h2>
                <div class="flex-grow min-h-0 mb-6"><canvas id="oddsChart"></canvas></div>
                <div id="odds-table" class="grid grid-cols-2 gap-4 p-4 bg-slate-800 rounded"></div>
            </div>
        </div>
    </main>

    <script>
        let myChart;
        async function fetchGames() {
            try {
                const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
                const json = await res.json();
                document.getElementById("status").innerText = "最後更新: " + (json.last_update || "--:--:--");
                const list = document.getElementById('games-list');
                list.innerHTML = json.data.map(g => `
                    <div onclick="selectGame('${g.id}', '${g.away_team} @ ${g.home_team}', '${g.away_team}', '${g.home_team}')" 
                         class="p-3 bg-slate-800 rounded cursor-pointer hover:bg-sky-900 border-l-4 border-sky-500">
                        <div class="text-sm font-bold truncate">${g.away_team} @ ${g.home_team}</div>
                    </div>
                `).join('');
            } catch(e) { console.error("初始化失敗:", e); }
        }

        async function selectGame(id, title, away, home) {
            document.getElementById('game-title').innerText = title;
            const res = await fetch(`https://mlb-pinnacle-tracker.onrender.com/history/${id}`);
            const data = await res.json();
            
            document.getElementById('odds-table').innerHTML = `
                <div class="text-sm">Pinnacle H2H (客) ${away}: <span class="font-bold text-sky-400">-150</span></div>
                <div class="text-sm">Pinnacle H2H (主) ${home}: <span class="font-bold text-sky-400">+130</span></div>
            `;

            const ctx = document.getElementById('oddsChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { 
                    labels: data.map(d => d.time), 
                    datasets: [{ label: 'Pinnacle Odds', data: data.map(d => d.odds), borderColor: '#38bdf8', tension: 0.1 }] 
                },
                options: { responsive: true, maintainAspectRatio: false, animation: false }
            });
        }
        
        fetchGames();
    </script>
</body>
</html>
