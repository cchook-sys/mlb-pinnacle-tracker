<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; }
    </style>
</head>
<body class="p-4 h-screen flex flex-col font-sans">
    <header class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
        <h1 class="text-xl font-bold text-white">⚾ MLB PINNACLE MONITOR</h1>
        <div id="status" class="text-sm font-mono text-sky-400">最後更新: --:--:-- CST</div>
    </header>

    <main class="flex-grow grid grid-cols-4 gap-4 overflow-hidden">
        <div id="games-list" class="col-span-1 overflow-y-auto space-y-2 pr-2"></div>
        
        <div class="col-span-3 flex flex-col gap-4">
            <div class="card p-6 h-full flex flex-col">
                <h2 id="game-title" class="text-xl font-bold mb-4 text-white">選擇比賽以查看盤口</h2>
                <div class="flex-grow min-h-0 mb-6">
                    <canvas id="oddsChart"></canvas>
                </div>
                <div id="live-odds" class="grid grid-cols-2 gap-4 p-4 bg-slate-800 rounded-lg border border-slate-700">
                    <div><p class="text-xs text-slate-400">大小分盤口</p><p id="tot-val" class="text-lg font-bold text-amber-400">--</p></div>
                    <div><p class="text-xs text-slate-400">當前贏家</p><p id="winner-val" class="text-lg font-bold text-sky-400">--</p></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let myChart;
        async function fetchGames() {
            try {
                const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
                const json = await res.json();
                document.getElementById("status").innerText = "最後更新: " + json.last_update;
                const list = document.getElementById("games-list");
                list.innerHTML = json.data.map(g => `
                    <div onclick="loadGame('${g.id}', '${g.away_team} @ ${g.home_team}')" class="p-3 bg-slate-800 rounded cursor-pointer hover:bg-sky-900 border-l-4 border-sky-500">
                        <div class="text-sm font-bold truncate">${g.away_team} @ ${g.home_team}</div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        async function loadGame(id, title) {
            document.getElementById('game-title').innerText = title;
            const res = await fetch(`https://mlb-pinnacle-tracker.onrender.com/history/${id}`);
            const data = await res.json();
            
            // 模擬盤口數據 (未來對接 API 的真實數值)
            document.getElementById('tot-val').innerText = "8.5"; 
            document.getElementById('winner-val').innerText = "客隊領先";

            const ctx = document.getElementById('oddsChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { 
                    labels: data.map(d => d.time), 
                    datasets: [{ label: 'Pinnacle Water', data: data.map(d => d.odds), borderColor: '#38bdf8', tension: 0.3 }] 
                },
                options: { maintainAspectRatio: false }
            });
        }
        fetchGames();
    </script>
</body>
</html>
