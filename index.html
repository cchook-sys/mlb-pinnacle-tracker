<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLBENTRY - Pinnacle 盤口監控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
:root{
  --bg:#07090f;--surface:#0d1117;--card:#0d1b2e;--border:#1e3a5f;--border2:#131d2e;
  --text:#e6edf3;--muted:#8b949e;--dim:#4b5563;
  --accent:#39ff14;--blue:#3b82f6;--orange:#f97316;
  --cyan:#38bdf8;--red:#f87171;--yellow:#fbbf24;--green:#4ade80;
  --purple:#a78bfa;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:2px;}

/* TOP BAR */
#topbar{
  background:linear-gradient(180deg,#0d1117 0%,#07090f 100%);
  border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
}
.logo{font-size:22px;font-weight:900;letter-spacing:4px;color:var(--text);}
.logo b{color:var(--accent);}
.meta{font-size:10px;color:var(--dim);margin-top:3px;display:flex;gap:10px;align-items:center;}
.meta .val{color:var(--muted);font-weight:600;}
.topright{display:flex;gap:8px;align-items:center;}

.statbox{display:flex;gap:0;background:#09101a;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.stat{text-align:center;padding:6px 14px;border-right:1px solid var(--border2);}
.stat:last-child{border-right:none;}
.stl{font-size:8px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px;}
.stv{font-size:18px;font-weight:900;font-family:monospace;line-height:1.1;}

.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:11px;padding:7px 16px;border-radius:6px;display:flex;align-items:center;gap:5px;transition:all .15s;letter-spacing:.5px;}
.btn:hover{filter:brightness(1.15);} .btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-blue{background:#1d4ed8;color:#fff;}
.btn-green{background:#0f2d0f;color:var(--accent);border:1px solid rgba(57,255,20,.25);}

/* TABS */
#tabbar{background:var(--bg);border-bottom:1px solid var(--border2);padding:8px 20px;display:flex;gap:6px;flex-shrink:0;}
.tab{background:transparent;border:1px solid var(--border);color:var(--dim);padding:5px 16px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;letter-spacing:.3px;}
.tab.on{background:#1d4ed8;border-color:#3b82f6;color:#fff;}
.tab:hover:not(.on){border-color:var(--muted);color:var(--muted);}

/* LAYOUT */
#main{display:flex;flex:1;overflow:hidden;}
#hview{display:none;flex:1;overflow:hidden;}

/* SIDEBAR */
#sidebar{width:350px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border2);display:flex;flex-direction:column;}

/* CORRECTION BANNER */
#corr-banner{flex-shrink:0;border-bottom:1px solid var(--border2);}
.corr-header{padding:8px 14px;background:#0a1628;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.corr-title{font-size:10px;font-weight:700;color:var(--yellow);letter-spacing:1px;}
.corr-toggle{font-size:10px;color:var(--dim);}
.corr-body{padding:0 14px 10px;}
.corr-hint{font-size:11px;padding:8px 10px;border-radius:5px;margin-bottom:6px;line-height:1.5;}
.corr-hint.win{background:rgba(74,222,128,.08);border-left:3px solid var(--green);color:#86efac;}
.corr-hint.loss{background:rgba(248,113,113,.08);border-left:3px solid var(--red);color:#fca5a5;}
.corr-hint.neutral{background:rgba(251,191,36,.08);border-left:3px solid var(--yellow);color:#fde68a;}
.corr-today{font-size:10px;color:var(--yellow);padding:6px 10px;background:#1a1205;border-radius:4px;border:1px solid rgba(251,191,36,.2);}

/* GAME CARD */
.gc{padding:11px 14px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .12s;border-left:3px solid transparent;position:relative;}
.gc:hover{background:rgba(255,255,255,.025);}
.gc.sel{background:var(--card);border-left-color:var(--blue);}
.gc.ov{border-left-color:var(--orange);}
.gc.un{border-left-color:var(--cyan);}
.gc.rd{border-left-color:var(--accent);}
.gc.rec{background:rgba(57,255,20,.03);}

.gr1{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.gdate{font-size:9px;color:var(--dim);font-family:monospace;}
.gsnap{font-size:9px;color:#1e3a5f;}
.gteams{font-size:13px;font-weight:800;color:var(--text);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.gteams .aw{color:var(--muted);}
.grec-badge{font-size:9px;font-weight:800;padding:1px 6px;border-radius:3px;background:rgba(57,255,20,.15);color:var(--accent);border:1px solid rgba(57,255,20,.3);}
.gr3{display:flex;justify-content:space-between;align-items:center;}
.gnums{display:flex;gap:8px;align-items:baseline;}
.gtot{font-size:14px;font-weight:900;font-family:monospace;color:var(--text);}
.gd{font-size:11px;font-weight:700;font-family:monospace;}
.gd.up{color:var(--orange);} .gd.dn{color:var(--cyan);} .gd.fl{color:var(--dim);}
.gbtn{font-size:10px;font-weight:800;padding:4px 11px;border-radius:4px;border:none;cursor:pointer;font-family:inherit;letter-spacing:.3px;}
.gbtn-enter{background:#dc2626;color:#fff;animation:pr 1.4s ease-in-out infinite;}
.gbtn-watch{background:#1a2535;color:var(--dim);cursor:default;}

/* DETAIL PANEL */
#detail{flex:1;overflow-y:auto;padding:20px 24px;background:var(--bg);}
.d-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim);gap:10px;text-align:center;}

.d-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.d-title{font-size:20px;font-weight:900;color:var(--text);}
.d-sub{font-size:11px;color:var(--dim);margin-top:3px;}
.d-sig{font-size:12px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:8px;}
.ebtn{background:#dc2626;color:#fff;border:none;padding:9px 20px;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;animation:pr 1.4s ease-in-out infinite;letter-spacing:.5px;white-space:nowrap;}
.ebtn.w{background:#1a2535;color:var(--dim);animation:none;cursor:default;}

/* CHART */
.cbox{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px;}
.clbl{font-size:9px;color:var(--dim);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase;}
.ccanvas{width:100%!important;height:220px!important;}

/* ODDS GRID */
.ogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.ocell{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 8px;text-align:center;}
.ol{font-size:8px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.ov2{font-size:16px;font-weight:900;font-family:monospace;}

/* SNAP TABLE */
.sbox{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.sh{padding:7px 12px;font-size:9px;color:var(--dim);letter-spacing:2px;border-bottom:1px solid var(--border);background:var(--surface);text-transform:uppercase;}
.stbl{width:100%;border-collapse:collapse;font-size:11px;}
.stbl th{padding:5px 10px;text-align:left;color:var(--dim);font-size:9px;border-bottom:1px solid var(--border);font-weight:600;}
.stbl td{padding:5px 10px;border-bottom:1px solid rgba(30,58,95,.2);font-family:monospace;}
.stbl tr.nw td{background:rgba(59,130,246,.06);}

/* HISTORY */
.hist-view{flex:1;overflow-y:auto;}
.hhead{padding:14px 20px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;background:var(--surface);}
.htbl{width:100%;border-collapse:collapse;font-size:12px;}
.htbl th{padding:9px 14px;font-size:9px;color:var(--dim);letter-spacing:1px;border-bottom:2px solid var(--border);background:var(--surface);font-weight:700;text-transform:uppercase;}
.htbl td{padding:10px 14px;border-bottom:1px solid rgba(30,58,95,.2);vertical-align:middle;}
.htbl tr:hover td{background:rgba(255,255,255,.02);}
.htbl tr.rec-row td:first-child{border-left:3px solid var(--accent);}
.htbl tr.rec-row td:first-child .badge-grade{background:rgba(57,255,20,.12);color:var(--accent);border:1px solid rgba(57,255,20,.3);}
.htbl tr.steam-row td:first-child{border-left:3px solid var(--orange);}
.badge-grade{display:inline-block;font-size:9px;font-weight:800;padding:1px 7px;border-radius:3px;margin-top:3px;}
.badge-steam{background:rgba(249,115,22,.12);color:var(--orange);border:1px solid rgba(249,115,22,.3);}

.rb{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:800;border:1px solid;}
.rw{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.3);}
.rl{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.3);}
.rp{background:rgba(251,191,36,.12);color:#fbbf24;border-color:rgba(251,191,36,.3);}
.rn{background:rgba(75,85,99,.1);color:var(--dim);border-color:rgba(75,85,99,.3);}

/* PARLAY MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center;padding:16px;backdrop-filter:blur(4px);}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid rgba(57,255,20,.2);border-radius:10px;width:100%;max-width:880px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 50px rgba(0,0,0,.6);}
.mhead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.mhead h2{font-size:17px;font-weight:900;letter-spacing:2px;color:var(--accent);}
.mbody{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;overflow-y:auto;}
.pc{background:var(--card);border:1px solid var(--border2);border-radius:8px;overflow:hidden;position:relative;}
.pc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--blue));}
.pcb{padding:12px 14px;}
.pt{font-size:9px;color:var(--dim);letter-spacing:2px;margin-bottom:8px;text-transform:uppercase;}
.plegs{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.pleg{background:var(--bg);border-radius:4px;padding:7px 9px;border:1px solid var(--border);}
.pgame{font-size:11px;font-weight:700;}
.ppick{font-size:11px;font-weight:900;margin-top:2px;}
.pconf{font-size:9px;color:var(--dim);margin-top:2px;}
.cbar{height:3px;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden;}
.cfill{height:100%;border-radius:2px;}
.pfoot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--border);padding-top:10px;margin-top:4px;}
.podds{font-size:26px;font-weight:900;font-family:monospace;}
.pscore{font-size:34px;font-weight:900;font-family:monospace;text-align:center;}
.pslbl{font-size:8px;color:var(--dim);text-align:center;letter-spacing:1px;}
.rsk{font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;border:1px solid;}
.rlo{background:rgba(74,222,128,.1);color:#4ade80;border-color:rgba(74,222,128,.25);}
.rme{background:rgba(251,191,36,.1);color:#fbbf24;border-color:rgba(251,191,36,.25);}
.rhi{background:rgba(248,113,113,.1);color:#f87171;border-color:rgba(248,113,113,.25);}
.pnote{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.5;}

/* SIGNAL BADGE */
.sig-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px;}
.sig-steam-over{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3);}
.sig-steam-under{background:rgba(56,189,248,.15);color:var(--cyan);border:1px solid rgba(56,189,248,.3);}
.sig-watch{background:rgba(75,85,99,.15);color:var(--dim);border:1px solid rgba(75,85,99,.3);}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pg{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pr{0%,100%{opacity:1}50%{opacity:.65}}
.spin{display:inline-block;animation:spin 1s linear infinite;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div>
    <div class="logo">MLB<b>ENTRY</b></div>
    <div class="meta">
      ET <span class="val" id="clk">--:--:--</span>
      &nbsp;·&nbsp; 場次 <span class="val" id="gc">0</span>
      &nbsp;·&nbsp; 快照 <span class="val" id="sc">0</span>
      &nbsp;·&nbsp; <span id="si" style="color:var(--dim)">連線中...</span>
    </div>
  </div>
  <div class="topright">
    <div class="statbox">
      <div class="stat"><div class="stl">蒸汽</div><div class="stv" id="ss" style="color:#f97316">0</div></div>
      <div class="stat"><div class="stl">可進場</div><div class="stv" id="sr" style="color:#39ff14;animation:pg 1.4s ease-in-out infinite">0</div></div>
      <div class="stat"><div class="stl">信號</div><div class="stv" id="sg" style="color:#3b82f6">0</div></div>
      <div class="stat"><div class="stl">蒸汽勝率</div><div class="stv" id="sw" style="color:#a78bfa">—</div></div>
    </div>
    <button class="btn btn-green" onclick="openParlay()">🎯 過關分析</button>
    <button class="btn btn-blue" id="rb" onclick="fetchData()">
      <span id="ri">↺</span><span id="rt">更新盤口</span>
    </button>
  </div>
</div>

<!-- TABS -->
<div id="tabbar">
  <button class="tab on" id="t1" onclick="swTab('today')">📡 今日盤口</button>
  <button class="tab" id="t2" onclick="swTab('history')">📊 昨日結算</button>
</div>

<!-- TODAY VIEW -->
<div id="main">
  <!-- LEFT: SIDEBAR -->
  <div id="sidebar">
    <!-- CORRECTION BANNER -->
    <div id="corr-banner" style="display:none;">
      <div class="corr-header" onclick="toggleCorr()">
        <span class="corr-title">📋 昨日推演修正提示</span>
        <span class="corr-toggle" id="corr-arr">▼</span>
      </div>
      <div class="corr-body" id="corr-body"></div>
    </div>
    <!-- GAME LIST -->
    <div id="glist" style="flex:1;">
      <div style="padding:40px 16px;text-align:center;color:var(--dim);font-size:12px;">
        <span class="spin" style="font-size:22px;display:block;margin-bottom:8px;">↺</span>連線中...
      </div>
    </div>
  </div>

  <!-- RIGHT: DETAIL -->
  <div id="detail">
    <div class="d-empty">
      <div style="font-size:44px;opacity:.15">📊</div>
      <div style="font-size:13px;color:var(--muted);font-weight:600;">點擊左側場次查看詳細分析</div>
      <div style="font-size:11px;color:var(--dim);margin-top:4px;">雙軸折線圖 · 快照歷史 · 進場建議</div>
    </div>
  </div>
</div>

<!-- HISTORY VIEW -->
<div id="hview">
  <div class="hist-view">
    <div class="hhead">
      <div>
        <div style="font-size:15px;font-weight:800;">昨日結算記錄</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px;">
          <span style="color:var(--accent);font-weight:700;">⚡ 推薦</span> = 移動 ≥ 1.0 &nbsp;·&nbsp;
          <span style="color:var(--orange);font-weight:700;">🔥 蒸汽</span> = 移動 0.5–1.0 &nbsp;·&nbsp;
          自動抓取賽果 · 每日覆蓋
        </div>
      </div>
      <div id="hst" style="text-align:right;"></div>
    </div>
    <div style="overflow-x:auto;">
      <table class="htbl">
        <thead><tr>
          <th>比賽</th><th>開盤</th><th>收盤</th><th>移動</th>
          <th>推算方向</th><th>實際總分</th><th>結果</th><th>修正方向</th>
        </tr></thead>
        <tbody id="htb">
          <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--dim)">載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- PARLAY MODAL -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeParlay()">
  <div class="modal">
    <div class="mhead">
      <h2>⚡ 過關建議</h2>
      <div style="display:flex;gap:12px;align-items:center;">
        <span style="font-size:10px;color:var(--dim)">⚡ 推薦場次優先 · 移動停滯才進場</span>
        <button onclick="closeParlay()" style="background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;">✕</button>
      </div>
    </div>
    <div class="mbody" id="pgrid"></div>
    <div style="padding:8px 16px;background:var(--bg);border-top:1px solid var(--border);font-size:10px;color:var(--dim);">
      ⚠ ⚡ 推薦（移動≥1.0）優先考慮 · 🔥 蒸汽（移動≥0.5）次要參考
    </div>
  </div>
</div>

<script>
const API='https://mlb-pinnacle-tracker.onrender.com';
let games=[],selId=null,chartObj=null,corrOpen=true;

// clock
setInterval(()=>{
  document.getElementById('clk').textContent=
    new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'America/New_York'});
},1000);

const fo=n=>n==null?'—':n>0?'+'+n:''+n;
const mu=iso=>Math.round((new Date(iso)-Date.now())/60000);
const fet=iso=>new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/New_York'});
const fdm=m=>m<=0?'🔴 LIVE':m>=60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')+'m':m+'m';

function sig(snaps){
  if(!snaps||snaps.length<2)return{lbl:'觀望',d:0,st:false,col:'#4b5563',pick:null,cls:'',rec:false};
  const d=+(snaps[snaps.length-1].total-snaps[0].total).toFixed(1);
  const rec=Math.abs(d)>=1.0;
  if(d>=0.5) return{lbl:'⚡ 大分蒸汽',d,st:true, col:'#f97316',pick:'OVER', cls:'ov',rec};
  if(d<=-0.5)return{lbl:'⚡ 小分蒸汽',d,st:true, col:'#38bdf8',pick:'UNDER',cls:'un',rec};
  if(d>=0.25)return{lbl:'↑ 大分傾向',d,st:false,col:'#fb923c',pick:'OVER', cls:'',rec:false};
  if(d<=-0.25)return{lbl:'↓ 小分傾向',d,st:false,col:'#7dd3fc',pick:'UNDER',cls:'',rec:false};
  return{lbl:'觀望',d,st:false,col:'#4b5563',pick:null,cls:'',rec:false};
}
function ent(snaps,mins){
  if(mins<=0)  return{lbl:'進行中',rdy:false};
  if(mins<20)  return{lbl:'已過期',rdy:false};
  const s=sig(snaps);
  if(!s.pick)  return{lbl:'觀望',rdy:false};
  if(snaps.length>=2){
    const r=Math.abs(snaps[snaps.length-1].total-snaps[snaps.length-2].total);
    if(r>=0.1) return{lbl:'等待停滯',rdy:false};
  }
  return{lbl:'進場',rdy:true};
}

// ── FETCH ─────────────────────────────────────────────────────────────────────
async function fetchData(){
  const rb=document.getElementById('rb');
  const ri=document.getElementById('ri');
  const rt=document.getElementById('rt');
  rb.disabled=true;ri.classList.add('spin');rt.textContent='更新中...';
  try{
    const [_,r]=await Promise.all([
      fetch(API+'/refresh').catch(()=>{}),
      fetch(API+'/games')
    ]);
    if(!r.ok)throw new Error('HTTP '+r.status);
    games=await r.json();
    games.sort((a,b)=>new Date(a.commence_time)-new Date(b.commence_time));
    document.getElementById('si').innerHTML='<span style="color:#39ff14;font-weight:700;">● 已連線</span>';
    document.getElementById('gc').textContent=games.length;
    document.getElementById('sc').textContent=games.reduce((s,g)=>s+(g.snapshot_count||0),0);
    renderList();
    if(selId){const g=games.find(g=>g.game_id===selId);if(g)renderDetail(g);}
    calcStats();
    fetchStats();
    fetchCorrections();
  }catch(e){
    document.getElementById('si').innerHTML='<span style="color:#f87171">✕ '+e.message+'</span>';
    document.getElementById('glist').innerHTML=
      `<div style="padding:30px 16px;text-align:center;color:#f87171;font-size:12px;">
        連線失敗<br><a href="${API}" target="_blank" style="color:#3b82f6;font-size:10px;margin-top:6px;display:block;">喚醒後端 →</a>
       </div>`;
  }finally{rb.disabled=false;ri.classList.remove('spin');rt.textContent='更新盤口';}
}

// ── CORRECTIONS ───────────────────────────────────────────────────────────────
async function fetchCorrections(){
  try{
    const r=await fetch(API+'/corrections');
    if(!r.ok)return;
    const data=await r.json();
    renderCorrections(data);
  }catch(_){}
}

function renderCorrections(data){
  const banner=document.getElementById('corr-banner');
  const body=document.getElementById('corr-body');
  if(!data||!data.corrections||!data.corrections.length){
    banner.style.display='none';return;
  }
  banner.style.display='block';
  let html='';
  // 今日整體提示
  const hintCls=data.steam_losses>data.steam_wins?'loss':data.steam_wins>0&&data.steam_losses===0?'win':'neutral';
  html+=`<div class="corr-hint ${hintCls}" style="margin-top:8px;">${data.today_hint}</div>`;
  // 各場修正
  data.corrections.forEach(c=>{
    const cls=c.type==='WIN'?'win':c.type==='LOSS'?'loss':'neutral';
    html+=`<div class="corr-hint ${cls}" style="font-size:10px;">
      <div style="font-weight:700;margin-bottom:2px;">${c.game}</div>
      <div>${c.message}</div>
      <div style="margin-top:3px;opacity:.8;">💡 ${c.hint}</div>
    </div>`;
  });
  body.innerHTML=html;
  if(!corrOpen)document.getElementById('corr-body').style.display='none';
}

function toggleCorr(){
  corrOpen=!corrOpen;
  document.getElementById('corr-body').style.display=corrOpen?'block':'none';
  document.getElementById('corr-arr').textContent=corrOpen?'▼':'▶';
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function calcStats(){
  let st=0,rd=0,sg=0;
  games.forEach(g=>{
    const snaps=(g.history||[]).filter(s=>s.total!=null);
    const s=sig(snaps),e=ent(snaps,mu(g.commence_time));
    if(s.st)st++;if(s.pick)sg++;if(e.rdy)rd++;
  });
  document.getElementById('ss').textContent=st;
  document.getElementById('sr').textContent=rd;
  document.getElementById('sg').textContent=sg;
}

async function fetchStats(){
  try{
    const r=await fetch(API+'/stats');if(!r.ok)return;
    const s=await r.json();
    // 顯示蒸汽場次勝率
    const wr=s.steam_total>0?s.steam_win_rate+'%':'—';
    document.getElementById('sw').textContent=wr;
  }catch(_){}
}

// ── RENDER LIST ───────────────────────────────────────────────────────────────
function renderList(){
  const el=document.getElementById('glist');
  if(!games.length){el.innerHTML='<div style="padding:40px 16px;text-align:center;color:var(--dim);font-size:12px;">目前無盤口數據</div>';return;}
  el.innerHTML=games.map(g=>{
    const snaps=(g.history||[]).filter(s=>s.total!=null);
    const mins=mu(g.commence_time);
    const s=sig(snaps),e=ent(snaps,mins);
    const cur=snaps.length?snaps[snaps.length-1].total:g.latest?.total;
    const mlD=snaps.length>=2?Math.round((snaps[snaps.length-1].ml_home||0)-(snaps[0].ml_home||0)):0;
    const dd=s.d,dc=dd>0?'up':dd<0?'dn':'fl';
    const ds=dd===0?'0':dd>0?'+'+dd:''+dd;
    const mdc=mlD>0?'up':mlD<0?'dn':'fl';
    const mds=mlD===0?'0':mlD>0?'+'+mlD:''+mlD;
    const home=(g.home||'').split(' ').pop();
    const away=(g.away||'').split(' ').pop();
    const dt=new Date(g.commence_time);
    const dstr=(dt.getMonth()+1).toString().padStart(2,'0')+'/'+(dt.getDate()).toString().padStart(2,'0');
    const isRec=s.rec; // 移動 ≥ 1.0
    let cls='gc'+(selId===g.game_id?' sel':'')+(s.cls?' '+s.cls:'')+(e.rdy&&!s.st?' rd':'')+(isRec?' rec':'');

    return `<div class="${cls}" onclick="selGame('${g.game_id}')">
      <div class="gr1">
        <span class="gdate">${dstr} ${fet(g.commence_time)} 📸:${g.snapshot_count||0}</span>
      </div>
      <div class="gteams">
        <span class="aw">${away}</span> VS ${home}
        ${isRec?'<span class="grec-badge">⚡推薦</span>':''}
      </div>
      <div class="gr3">
        <div class="gnums">
          <span class="gtot">${cur??'—'}</span>
          <span class="gd ${dc}">大小: ${ds}</span>
          <span class="gd ${mdc}" style="font-size:10px;">獨贏: ${mds}</span>
        </div>
        <button class="gbtn ${e.rdy?'gbtn-enter':'gbtn-watch'}"
          onclick="event.stopPropagation();selGame('${g.game_id}')">
          ${e.rdy?'🔥 進場':'🚀 觀望'}
        </button>
      </div>
    </div>`;
  }).join('');
}

// ── SELECT + DETAIL ───────────────────────────────────────────────────────────
function selGame(id){
  selId=id;renderList();
  const g=games.find(g=>g.game_id===id);
  if(g)renderDetail(g);
}

    <div class="d-head">

        <div class="d-title">
          ${away.split(' ').pop()} VS ${home.split(' ').pop()}
          ${isRec?'<span style="font-size:13px;color:var(--accent);margin-left:8px;">⚡ 推薦</span>':''}
        </div>
        <div class="d-sub">${dstr} ${fet(g.commence_time)} ET · ${fdm(mins)}</div>
        <div class="d-sig">
          <span class="sig-badge ${s.st?(s.d>0?'sig-steam-over':'sig-steam-under'):'sig-watch'}">${s.lbl}</span>
          ${s.d!==0?`<span style="font-family:monospace;color:${s.d>0?'#f97316':'#38bdf8'}">${s.d>0?'▲+':'▼'}${Math.abs(s.d)}</span>`:''}
          <span style="font-size:10px;color:var(--dim);">${g.snapshot_count||0} 快照</span>
        </div>
      </div>
      <button class="ebtn${e.rdy?'':' w'}"
        onclick="${e.rdy?`alert('進場方向：${s.lbl}\\n大小分：${cur}\\n\\n規則：移動停滯後才進場')`:''}"
      >${e.rdy?'🔥 建議進場':e.lbl}</button>
    </div>

    <div class="cbox">
      <div class="clbl">盤口移動走勢 · Pinnacle 快照（有變動才記錄）</div>
      <canvas id="lc" class="ccanvas"></canvas>
    </div>

    <div class="ogrid">
      <div class="ocell"><div class="ol">開盤</div><div class="ov2" style="color:#8b949e">${open??'—'}</div></div>
      <div class="ocell"><div class="ol">現盤</div><div class="ov2" style="color:#e6edf3">${cur??'—'}</div></div>
      <div class="ocell"><div class="ol">Over</div><div class="ov2" style="color:#f97316">${fo(lat.over_juice)}</div></div>
      <div class="ocell"><div class="ol">Under</div><div class="ov2" style="color:#38bdf8">${fo(lat.under_juice)}</div></div>
      <div class="ocell"><div class="ol">主隊 ML</div><div class="ov2" style="color:#e6edf3">${fo(lat.ml_home)}</div></div>
      <div class="ocell"><div class="ol">客隊 ML</div><div class="ov2" style="color:#8b949e">${fo(lat.ml_away)}</div></div>
      <div class="ocell"><div class="ol">移動幅度</div><div class="ov2" style="color:${s.d>0?'#f97316':s.d<0?'#38bdf8':'#4b5563'}">${s.d>0?'+':''}${s.d}</div></div>
      <div class="ocell"><div class="ol">讓分</div><div class="ov2" style="color:#8b949e">${fo(lat.spread_home)}</div></div>
    </div>

    ${snaps.length>0?`
    <div class="sbox">
      <div class="sh">快照歷史 · ${snaps.length} 筆</div>
      <table class="stbl">
        <thead><tr><th>#</th><th>大小分</th><th>移動</th><th>Over</th><th>Under</th><th>主ML</th><th>客ML</th></tr></thead>
        <tbody>${[...snaps].reverse().map((s2,i)=>{
          const prev=snaps[snaps.length-2-i];
          const d2=s2.total!=null&&prev?.total!=null?+(s2.total-prev.total).toFixed(1):null;
          const dc2=d2==null?'#4b5563':d2>0?'#f97316':d2<0?'#38bdf8':'#4b5563';
          return `<tr class="${i===0?'nw':''}">
            <td style="color:#4b5563">${snaps.length-i}</td>
            <td style="font-weight:${i===0?800:400};color:${i===0?'#e6edf3':'#8b949e'}">${s2.total??'—'}</td>
            <td style="color:${dc2};font-weight:700">${d2==null?'—':d2===0?'─':d2>0?`▲+${d2}`:`▼${d2}`}</td>
            <td style="color:#f97316">${fo(s2.over_juice)}</td>
            <td style="color:#38bdf8">${fo(s2.under_juice)}</td>

  if(chartObj){chartObj.destroy();chartObj=null;}
  const cv=document.getElementById('lc');

  const labels=snaps.map(s2=>new Date(s2.ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/New_York'}));

// ── TAB ───────────────────────────────────────────────────────────────────────
function swTab(t){
  const isT=t==='today';
  document.getElementById('main').style.display=isT?'flex':'none';
  document.getElementById('hview').style.display=isT?'none':'flex';
  document.getElementById('t1').classList.toggle('on',isT);
  document.getElementById('t2').classList.toggle('on',!isT);

// ── HISTORY ───────────────────────────────────────────────────────────────────
async function fetchHist(){
  const tb=document.getElementById('htb');
  tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--dim)">載入中...</td></tr>';
  try{
    const r=await fetch(API+'/history');
    if(!r.ok)throw new Error('HTTP '+r.status);
    renderHist(await r.json());
  }catch(e){
    tb.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:30px;color:#f87171">載入失敗：${e.message}</td></tr>`;
  }
}

function renderHist(data){
  const tb=document.getElementById('htb');
  if(!data.length){
    tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--dim)">昨日尚無蒸汽信號記錄（移動 ≥ 0.5）</td></tr>';
    return;
  }
  let w=0,l=0,p=0,rw=0,rl=0;
  tb.innerHTML=data.map(g=>{
    const d=g.total_delta||0;
    const isRec=g.recommended||Math.abs(d)>=1.0;
    const grade=g.grade||(isRec?'⚡ 推薦':'🔥 蒸汽');
    const ds=d===0?'─':d>0?`<span style="color:#f97316;font-weight:700">▲+${d}</span>`:`<span style="color:#38bdf8;font-weight:700">▼${d}</span>`;
    let rb='<span class="rb rn">未結算</span>';
    if(g.result==='WIN') {rb='<span class="rb rw">✓ 過盤</span>';w++;if(isRec)rw++;}
    if(g.result==='LOSS'){rb='<span class="rb rl">✗ 未過</span>';l++;if(isRec)rl++;}
    if(g.result==='PUSH'){rb='<span class="rb rp">~ Push</span>';p++;}
    let co='─';
    if(g.result==='LOSS'&&g.pick)
      co=g.pick.includes('OVER')?'<span style="color:#38bdf8">↓ 下次考慮小分</span>':'<span style="color:#f97316">↑ 下次考慮大分</span>';
    else if(g.result==='WIN')co='<span style="color:#4ade80">✓ 方向正確</span>';

    const rowCls=isRec?'rec-row':'steam-row';
    const gradeCls=isRec?'':'badge-steam';
    return `<tr class="${rowCls}">
      <td>
        <div style="font-weight:700;font-size:12px">${(g.away||'').split(' ').pop()} @ ${(g.home||'').split(' ').pop()}</div>
        <div style="font-size:10px;color:var(--dim);margin-top:1px">${fet(g.commence_time)}</div>
        <span class="badge-grade ${gradeCls}">${grade}</span>
      </td>
      <td style="font-family:monospace;color:#8b949e">${g.open_total??'—'}</td>
      <td style="font-family:monospace;font-weight:800;font-size:14px">${g.close_total??'—'}</td>
      <td>${ds}</td>
      <td style="font-weight:800;color:${g.pick?.includes('OVER')?'#f97316':'#38bdf8'}">${g.pick||'<span style="color:var(--dim)">觀望</span>'}</td>
      <td style="font-family:monospace;font-size:17px;font-weight:900">${g.actual_total??'—'}</td>
      <td>${rb}</td>
      <td style="font-size:11px">${co}</td>
    </tr>`;
  }).join('');

  const tot=w+l;
  const wr=tot>0?Math.round(w/tot*100):0;
  const rtot=rw+rl;
  const rwr=rtot>0?Math.round(rw/rtot*100):0;
  document.getElementById('hst').innerHTML=
    `<div style="font-size:13px;">
      <div style="font-weight:800;color:var(--text);">${w}勝 ${l}敗 ${p}平</div>
      <div style="color:${wr>=55?'#4ade80':wr>=45?'#fbbf24':'#f87171'};font-weight:800;font-size:14px;">全部勝率 ${wr}%</div>
      ${rtot>0?`<div style="color:var(--accent);font-size:11px;margin-top:2px;">⚡ 推薦 ${rw}勝${rl}敗 (${rwr}%)</div>`:''}
    </div>`;
}

// ── PARLAY ────────────────────────────────────────────────────────────────────
function openParlay(){document.getElementById('modal').classList.add('open');buildParlay();}
function closeParlay(){document.getElementById('modal').classList.remove('open');}
const td2=o=>o==null?1.91:o>0?+(1+o/100).toFixed(3):+(1+100/Math.abs(o)).toFixed(3);

function buildParlay(){
  const pg=document.getElementById('pgrid');
  const scored=games.map(g=>{
    const snaps=(g.history||[]).filter(s=>s.total!=null);
    const mins=mu(g.commence_time);
    const s=sig(snaps),e=ent(snaps,mins);
    let sc=0;
    // 推薦場次加分更多
    if(Math.abs(s.d)>=1.0)sc+=55;
    else if(Math.abs(s.d)>=0.5)sc+=35;
    else if(Math.abs(s.d)>=0.25)sc+=15;
    if(e.rdy)sc+=25;else if(e.lbl==='等待停滯')sc+=10;
    const sn=g.snapshot_count||0;
    if(sn>=5)sc+=15;else if(sn>=3)sc+=10;else if(sn>=2)sc+=5;
    if(mins>=120&&mins<=480)sc+=10;
    const oj=g.latest?.over_juice,uj=g.latest?.under_juice;
    if(oj&&uj&&Math.abs(oj)<=115&&Math.abs(uj)<=115)sc+=10;
    let pick=null,pl='觀望',pc='#4b5563';
    if(s.d>=0.5){pick='OVER';pl=(s.rec?'⚡ ':'🔥 ')+'大分 OVER '+g.latest?.total;pc=s.rec?'#39ff14':'#f97316';}
    else if(s.d<=-0.5){pick='UNDER';pl=(s.rec?'⚡ ':'🔥 ')+'小分 UNDER '+g.latest?.total;pc=s.rec?'#38bdf8':'#38bdf8';}
    else if(s.d>=0.25){pick='OVER';pl='↑ 大分傾向 '+g.latest?.total;pc='#fb923c';}
    else if(s.d<=-0.25){pick='UNDER';pl='↓ 小分傾向 '+g.latest?.total;pc='#7dd3fc';}
    return{g,sc,pick,pl,pc,s,snaps,rec:s.rec};
  }).filter(x=>x.sc>=50&&x.pick).sort((a,b)=>b.sc-a.sc);

  if(!scored.length){
    pg.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--dim);font-size:12px;">快照不足，無法產生建議<br><span style="font-size:10px;color:#1e3a5f">等待 30 分鐘快照更新</span></div>';return;
  }
  const parlays=[
    {t:'🎯 單場最強',legs:scored.slice(0,1),note:'推薦場次優先，移動停滯才進場'},
    scored.length>=2&&{t:'🔗 2串1',legs:scored.slice(0,2),note:'⚡ 推薦場次組合，中風險'},
    scored.length>=3&&{t:'🚀 3串1',legs:scored.slice(0,3),note:'高賠率高風險，建議小注'},
  ].filter(Boolean);

  pg.innerHTML=parlays.map(p=>{
    const dec=p.legs.map(l=>td2(l.pick==='OVER'?l.g.latest?.over_juice:l.g.latest?.under_juice));
    const cb=dec.reduce((a,b)=>a*b,1);
    const ca=cb>=2?'+'+Math.round((cb-1)*100):'-'+Math.round(100/(cb-1));
    const ac=Math.round(p.legs.reduce((s,l)=>s+l.sc,0)/p.legs.length);
    const cc=ac>=75?'#39ff14':ac>=60?'#fbbf24':'#f87171';
    const rl=p.legs.length===1?(ac>=70?'低風險':'中風險'):p.legs.length===2?'中風險':'高風險';
    const rc=rl==='低風險'?'rlo':rl==='中風險'?'rme':'rhi';
    const hasRec=p.legs.some(l=>l.rec);
    const lh=p.legs.map(l=>`<div class="pleg" style="border-color:${l.rec?'rgba(57,255,20,.2)':'var(--border)'}">
      <div class="pgame" style="color:${l.rec?'var(--accent)':'var(--text)'}">${(l.g.away||'').split(' ').pop()} VS ${(l.g.home||'').split(' ').pop()}</div>
      <div class="ppick" style="color:${l.pc}">${l.pl}</div>
      <div class="pconf">信心 ${l.sc}/100 · ${l.g.snapshot_count||0} 快照</div>
      <div class="cbar"><div class="cfill" style="width:${l.sc}%;background:${cc}"></div></div>
    </div>`).join('');
    return `<div class="pc"><div class="pcb">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="pt">${p.t} ${hasRec?'<span style="color:var(--accent)">⚡推薦</span>':''}</div>
        <span class="rsk ${rc}">${rl}</span>
      </div>
      <div class="plegs">${lh}</div>
      <div class="pfoot">
        <div><div style="font-size:9px;color:var(--dim);margin-bottom:2px;letter-spacing:1px;">組合賠率</div>
          <div class="podds" style="color:${cc}">${ca}</div></div>
        <div><div class="pscore" style="color:${cc}">${ac}</div>
          <div class="pslbl">平均信心</div></div>
      </div>
      <div class="pnote">${p.note}</div>
    </div></div>`;
  }).join('');
}
