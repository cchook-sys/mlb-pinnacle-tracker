<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Pinnacle 智能量化儀表板</title>
    <style>
        :root { --bg:#0b1120; --card:#1e293b; --accent:#38bdf8; --text:#f1f5f9; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        .header { margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .status { background: #064e3b; color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .stats-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; width: fit-content; }
        
        .game-card { background: var(--card); border: 2px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 15px; transition: 0.3s; }
        .game-card:hover { border-color: var(--accent); }
        .teams { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .meta { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }
        .metrics { display: flex; gap: 20px; font-size: 14px; }
        .val { font-weight: 700; color: var(--accent); }
        .sleep-btn { background: #1e293b; color: #64748b; padding: 5px 12px; border-radius: 8px; font-size: 12px; float: right; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="header">
    <div class="title">⚾ MLB Pinnacle <span class="status">● 已連線</span></div>
    <p style="color:#64748b; font-size: 14px; margin-top:10px;">即時監控美金盤精準資金流向，全自動捕捉大小分與獨贏蒸氣盤進場訊號</p>
</div>

<div class="stats-box">
    <div>資料庫來源: <span style="color:var(--accent)">MongoDB Atlas</span></div>
    <div>更新頻率: <span style="color:#fbbf24">10 分鐘智慧過濾</span></div>
</div>

<div id="glist">載入中...</div>

<script>
const API = 'https://mlb-pinnacle-tracker.onrender.com';
async function fetchData() {
    try {
        const r = await fetch(`${API}/games`, { mode: 'cors', cache: 'no-store' });
        const games = await r.json();
        const list = document.getElementById('glist');
        list.innerHTML = games.map(g => `
            <div class="game-card">
                <button class="sleep-btn">💤 觀望中</button>
                <div class="meta">06/03 06:41 · 快照:${g.snapshot_count || 0}</div>
                <div class="teams">${g.away} 客 VS ${g.home} 主</div>
                <div class="metrics">
                    <div>大小分變動: <span class="val">0</span></div>
                    <div>主獨贏變動: <span class="val" style="color:${(g.latest?.ml_home||0) < 0 ? '#f87171' : '#38bdf8'}">${g.latest?.ml_home || 0}</span></div>
                </div>
            </div>
        `).join('');
    } catch(e) { document.getElementById('glist').innerHTML = "連線失敗"; }
}
window.onload = fetchData;
</script>
</body>
</html>
