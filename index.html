<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBENTRY v4 - Pinnacle 盤口監控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1624; color: #e2e8f0; font-family: -apple-system, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .anim-spin { animation: spin 1s linear infinite; display:inline-block; }
        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        .tab-btn.active { background:#1d4ed8; color:#fff; border-color:#3b82f6; }
        .conf-bar { height:3px; background:#1e3a5f; border-radius:2px; }
        .conf-fill { height:100%; border-radius:2px; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div id="app" class="max-w-7xl mx-auto space-y-5">
        <div id="status-text">連線中...</div>
        <button id="refresh-btn" onclick="fetchData()">更新盤口</button>
        <tbody id="today-tbody"></tbody>
    </div>

<script>
const API = 'https://mlb-pinnacle-tracker.onrender.com';
let allGames = [];

async function fetchData() {
    const btn = document.getElementById('refresh-btn');
    const st = document.getElementById('status-text');
    btn.disabled = true; 
    st.innerHTML = '正在刷新數據...';

    try {
        const res = await fetch(API + '/games', { cache: 'no-cache' });
        const json = await res.json();
        
        // 【關鍵橋接層】將 MongoDB 資料轉換為 renderToday 等函式預期的結構
        allGames = (json.data || []).map(item => {
            const d = item.data || {};
            return {
                id: item.game_id,
                home: d.home || 'Unknown',
                away: d.away || 'Unknown',
                commence_time: d.commence_time || '',
                snapshot_count: 1,
                latest: {
                    total: d.total || 0,
                    over_juice: d.over_price || 0,
                    under_juice: d.under_price || 0,
                    ml_home: d.ml_home || 0,
                    ml_away: d.ml_away || 0
                },
                open: { total: d.total || 0 },
                history: [{total: d.total || 0}]
            };
        });

        st.innerHTML = '<span class="text-green-400 font-bold">● 已連線</span>';
        
        // 觸發你原本寫好的渲染與分析邏輯
        if (typeof renderToday === 'function') renderToday();
        if (typeof fetchStats === 'function') fetchStats();
        
    } catch(e) {
        console.error("fetchData 錯誤:", e);
        st.innerHTML = '<span class="text-red-400">連線失敗</span>';
    } finally {
        btn.disabled = false;
    }
}

// 確保執行入口
window.onload = fetchData;
</script>
</body>
</html>
