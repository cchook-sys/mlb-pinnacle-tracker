<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><title>Debug Tracker</title></head>
<body class="bg-black text-white p-4">
    <h1 class="text-xl">即時數據偵錯區</h1>
    <pre id="debug" class="text-xs text-green-400"></pre>
    <script>
        fetch("https://mlb-pinnacle-tracker.onrender.com/games")
            .then(r => r.json())
            .then(d => {
                document.getElementById("debug").innerText = JSON.stringify(d, null, 2);
            });
    </script>
</body>
</html>
