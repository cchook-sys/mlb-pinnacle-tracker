<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .sidebar { background-color: #1e293b; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-4 h-screen flex flex-col">
    <header class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h1 class="text-xl font-bold text-white">⚾ MLB PINNACLE TRACKER</h1>
        <div id="status" class="text-sm font-mono text-sky-400">最後更新時間: --:--:-- CST</div>
    </header>

    <main class="flex-grow grid grid-cols-4 gap-4 overflow-hidden">
        <div class="sidebar rounded-lg p-3 overflow-y-auto">
            <h2 class="text-xs font-bold text-slate-400 uppercase mb-3">Today's Games</h2>
            <div id="games-list" class="space-y-2"></div>
        </div>

        <div class="col-span-3 flex flex-col gap-4">
            <div class="card p-4 h-2/3">
                <h2 class="text-lg font-bold mb-2">PHILADELPHIA PHILLIES @ LOS ANGELES DODGERS</h2>
                <canvas id="oddsChart"></canvas>
            </div>
            <div class="card p-4 h-1/3 grid grid-cols-2 gap-4">
                <div><h3 class="text-sm font-bold text-slate-400">ODDS TABLE (LIVE)</h3></div>
                <div id="odds-table" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <script>
        // 渲染列表的邏輯 (這部分保持與後端對接)
        async function fetchGames() {
            const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
            const json = await res.json();
            document.getElementById("status").innerText = "最後更新時間: " + json.last_update + " CST";
            const list = document.getElementById("games-list");
            list.innerHTML = json.data.map(g => `
                <div class="p-3 bg-slate-800 rounded hover:bg-slate-700 cursor-pointer border-l-4 border-sky-500">
                    <div class="text-sm font-bold">${g.away_team} @ ${g.home_team}</div>
                </div>
            `).join('');
        }
        fetchGames();
    </script>
</body>
</html>
