<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB PINNACLE TRACKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-slate-900 text-white p-6">
    <h1 class="text-3xl font-bold mb-8 text-center text-blue-400">MLB PINNACLE TRACKER</h1>
    
    <div id="games-list" class="max-w-2xl mx-auto space-y-4">
        <p class="text-center text-slate-500">正在載入即時盤口...</p>
    </div>

    <div id="game-modal" class="modal fixed inset-0 bg-black bg-opacity-80 items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-lg w-full max-w-lg border border-slate-600">
            <h2 id="modal-title" class="text-2xl font-bold mb-4">賽事詳情</h2>
            <div id="modal-content" class="text-slate-300 space-y-2"></div>
            <button onclick="closeModal()" class="mt-6 w-full py-2 bg-blue-600 hover:bg-blue-500 rounded font-bold">關閉</button>
        </div>
    </div>

    <script>
        let allGames = [];

        document.addEventListener('DOMContentLoaded', () => {
            async function fetchGames() {
                const container = document.getElementById('games-list');
                try {
                    const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
                    const json = await res.json();
                    
                    if (json.data && json.data.length > 0) {
                        allGames = json.data;
                        container.innerHTML = json.data.map(g => `
                            <div class="p-4 bg-slate-800 rounded border border-slate-700 cursor-pointer hover:border-blue-500 transition" 
                                 onclick="showDetails('${g.id}')">
                                <h2 class="text-xl font-bold">${g.away_team} VS ${g.home_team}</h2>
                                <p class="text-sm text-slate-400">開賽: ${new Date(g.commence_time).toLocaleString()}</p>
                            </div>
                        `).join('');
                    } else {
                        container.innerHTML = "<p class='text-center'>目前暫無賽事資料</p>";
                    }
                } catch (e) {
                    console.error("抓取失敗:", e);
                    container.innerHTML = "<p class='text-center text-red-400'>連線失敗，請檢查 API</p>";
                }
            }

            window.showDetails = (gameId) => {
                const game = allGames.find(g => g.id === gameId);
                if (!game) return;

                document.getElementById('modal-title').innerText = `${game.away_team} vs ${game.home_team}`;
                document.getElementById('modal-content').innerHTML = `
                    <p><strong>聯盟:</strong> ${game.sport_title}</p>
                    <p><strong>賽事 ID:</strong> ${game.id}</p>
                    <p><strong>書商數量:</strong> ${game.bookmakers ? game.bookmakers.length : 0}</p>
                `;
                document.getElementById('game-modal').classList.add('active');
            };

            window.closeModal = () => {
                document.getElementById('game-modal').classList.remove('active');
            };

            fetchGames();
            setInterval(fetchGames, 60000);
        });
    </script>
</body>
</html>
