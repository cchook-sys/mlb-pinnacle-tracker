<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Pinnacle 智能量化儀表板</title>
    <style>
        :root { --bg:#0b1120; --card:#1e293b; --accent:#38bdf8; --text:#f1f5f9; --border:#334155; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* 側邊欄樣式 */
        #glist { width: 400px; border-right: 1px solid var(--border); overflow-y: auto; padding: 20px; }
        .game-card { background: var(--card); border: 2px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .game-card:hover { border-color: var(--accent); }
        
        /* 右側面板樣式 */
        #dpanel { flex: 1; padding: 40px; display: flex; align-items: center; justify-content: center; overflow-y: auto; }
        .dashboard-ui { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; }
        .data-val { font-size: 28px; font-weight: 800; color: #fff; }
        .data-lbl { color: #94a3b8; font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="glist">
    <div style="font-size:20px; font-weight:800; margin-bottom:20px; display:flex; justify-content:space-between;">
        ⚾ MLB Pinnacle
        <button onclick="fetchData()" style="font-size:12px; cursor:pointer;">↺ 更新</button>
    </div>
    <div id="game-list-content">讀取中...</div>
</div>

<div id="dpanel">
    <div id="detail-content" style="text-align:center; color:#64748b;">請點擊左側場次查看詳細數據</div>
</div>

<script>
const API = 'https://mlb-pinnacle-tracker.onrender.com';
let games = [];

async function fetchData() {
    const list = document.getElementById('game-list-content');
    list.innerHTML = "抓取中...";
    try {
        // 強制不使用快取，確保資料最新
        const r = await fetch(`${API}/games?t=${Date.now()}`, { mode: 'cors', cache: 'no-store' });
        games = await r.json();
        
        if (games.length === 0) {
            list.innerHTML = "目前暫無盤口資料";
            return;
        }

        list.innerHTML = games.map(g => `
            <div class="game-card" onclick="selectGame('${g.game_id}')">
                <div style="font-weight:700; margin-bottom:8px;">${g.away || '客隊'} 客 VS ${g.home || '主隊'} 主</div>
                <div style="display:flex; gap:15px; font-size:13px; color:#94a3b8;">
                    <div>總分: <span style="color:var(--accent)">${g.latest?.total ?? '--'}</span></div>
                    <div>主獨贏: <span style="color:#f87171">${g.latest?.ml_home ?? '--'}</span></div>
                </div>
            </div>
        `).join('');
    } catch(e) {
        list.innerHTML = "連線失敗，請檢查後端狀態";
        console.error(e);
    }
}

function selectGame(id) {
    const g = games.find(item => item.game_id === id);
    if (!g) return;
    
    document.getElementById('detail-content').innerHTML = `
        <div class="dashboard-ui">
            <h2 style="margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;">${g.away} VS ${g.home}</h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <div><div class="data-lbl">目前總分</div><div class="data-val">${g.latest?.total ?? '--'}</div></div>
                <div><div class="data-lbl">開盤總分</div><div class="data-val" style="color:#475569">${g.open?.total ?? '--'}</div></div>
                <div style="color:#f97316;">Over 賠率: ${g.latest?.over_juice ?? '--'}</div>
                <div style="color:var(--accent);">Under 賠率: ${g.latest?.under_juice ?? '--'}</div>
            </div>
        </div>
    `;
}

// 自動初始化
window.onload = fetchData;
</script>
</body>
</html>
