<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MLB 數據監控 (現場直出版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-200 p-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold text-white mb-2">⚾ MLB 數據監控 (現場直出版)</h1>
        <div id="status" class="text-sm text-sky-400 font-mono mb-6">最後同步: --:--:--</div>
        <div id="games-list" class="grid gap-4"></div>
    </div>

    <script>
        async function fetchGames() {
            try {
                const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
                const json = await res.json();
                document.getElementById("status").innerText = "最後同步: " + (json.system_updated_at || "未知");
                
                const list = document.getElementById("games-list");
                list.innerHTML = "";
                
                const games = json.data || [];
                games.forEach(g => {
                    // 這裡根據你剛剛拿到的數據結構來提取盤口
                    // 如果數據裡有 bookmakers，我們優先找 Pinnacle，沒有就找第一個
                    const bookies = g.bookmakers || [];
                    const pin = bookies.find(b => b.key === 'pinnacle') || bookies[0];
                    const odds = pin ? pin.markets.find(m => m.key === 'h2h') : null;
                    const price = odds ? odds.outcomes[0].price : '無';
                    
                    list.innerHTML += `
                        <div class="bg-gray-900 p-5 rounded-xl border border-gray-800 shadow-lg hover:border-sky-500 transition-all">
                            <div class="flex justify-between items-center">
                                <div class="font-bold text-lg text-white">${g.away_team} VS ${g.home_team}</div>
                                <div class="bg-sky-900 text-sky-200 px-3 py-1 rounded text-sm font-bold">獨贏水位: ${price}</div>
                            </div>
                            <div class="text-xs text-gray-500 mt-2 font-mono">開賽時間: ${g.commence_time.replace('T', ' ').replace('Z', '')}</div>
                        </div>`;
                });
            } catch (e) {
                document.getElementById("status").innerText = "❌ 獲取數據失敗";
            }
        }
        fetchGames();
    </script>
</body>
</html>
