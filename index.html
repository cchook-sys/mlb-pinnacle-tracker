<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLBENTRY - Pinnacle 盤口監控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* (你的原始 CSS 代碼已全數保留) */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0f1a; --surface:#111827; --card:#0d1b2e; --border:#1e3a5f;
  --text:#e6edf3; --muted:#8b949e; --dim:#4b5563;
  --accent:#39ff14; --blue:#3b82f6; --orange:#f97316;
  --cyan:#38bdf8; --red:#f87171; --yellow:#fbbf24; --green:#4ade80;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:2px;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;flex-shrink:0;}
.logo{font-size:22px;font-weight:900;letter-spacing:3px;} .logo span{color:var(--accent);}
.topbar-meta{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--dim);margin-top:2px;}
.topbar-right{display:flex;gap:8px;align-items:center;}
.stat-row{display:flex;gap:12px;background:#09101a;border:1px solid var(--border);border-radius:5px;padding:6px 14px;}
.stat{text-align:center;} .stat-lbl{font-size:8px;color:var(--dim);letter-spacing:1px;} .stat-val{font-size:18px;font-weight:900;font-family:monospace;line-height:1.2;}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:11px;padding:7px 14px;border-radius:5px;display:flex;align-items:center;gap:5px;transition:all .15s;letter-spacing:.3px;}
.btn-blue{background:#1d4ed8;color:#fff;} .btn-blue:hover{background:#2563eb;}
.btn-green{background:#0f2d0f;color:var(--accent);border:1px solid rgba(57,255,20,.3);} .btn-green:hover{background:#153d15;}
.tabbar{background:var(--bg);border-bottom:1px solid #1a2535;padding:8px 20px;display:flex;gap:6px;flex-shrink:0;}
.tab{background:transparent;border:1px solid #1e3a5f;color:var(--dim);padding:5px 14px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.tab.on{background:#1d4ed8;border-color:#3b82f6;color:#fff;}
.main{display:flex;height:calc(100vh - 93px);overflow:hidden;}
.sidebar{width:360px;flex-shrink:0;overflow-y:auto;border-right:1px solid #1a2535;}
.game-card{padding:12px 14px;border-bottom:1px solid #1a2535;cursor:pointer;transition:background .12s;border-left:3px solid transparent;}
.game-card:hover{background:rgba(255,255,255,.03);}
.game-card.sel{background:#0d1b2e;border-left-color:var(--blue);}
.gc-teams{font-size:13px;font-weight:800;color:var(--text);margin-bottom:6px;}
.gc-total{font-size:14px;font-weight:900;font-family:monospace;color:var(--text);}
.gc-btn{font-size:10px;font-weight:800;padding:4px 12px;border-radius:4px;border:none;cursor:pointer;font-family:inherit;}
.gc-btn-enter{background:#dc2626;color:#fff;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="logo">MLB<span>ENTRY</span></div>
    <div class="topbar-meta">ET <span id="et-clock" style="color:#3b82f6;font-family:monospace;font-weight:700">--:--:--</span> · <span id="si">連線中...</span></div>
  </div>
  <div class="topbar-right">
    <div class="stat-row">
      <div class="stat"><div class="stat-lbl">蒸汽</div><div class="stat-val" id="ss">0</div></div>
      <div class="stat"><div class="stat-lbl">可進場</div><div class="stat-val" id="sr">0</div></div>
    </div>
    <button class="btn btn-blue" id="rbtn" onclick="fetchData()">↺ 更新盤口</button>
  </div>
</div>

<div class="tabbar">
  <button class="tab on" id="t1" onclick="switchTab('today')">📡 今日盤口</button>
  <button class="tab" id="t2" onclick="switchTab('history')">📊 昨日結算</button>
</div>

<div class="main" id="vt">
  <div class="sidebar" id="glist"><div class="sidebar-empty"><span class="spin">↺</span> 載入中...</div></div>
  <div class="detail" id="dpanel"><div class="detail-empty">選擇場次查看分析</div></div>
</div>

<script>
const API='https://mlb-pinnacle-tracker.onrender.com';
let games=[];

async function fetchData(){
  const btn=document.getElementById('rbtn');
  btn.disabled=true; btn.textContent='更新中...';
  try{
    // 加入 mode: 'cors' 與 cache: 'no-store' 修正連線問題
    const r=await fetch(`${API}/games`, { mode: 'cors', cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP '+r.status);
    games=await r.json();
    document.getElementById('si').innerHTML='<span style="color:#39ff14">● 已連線</span>';
    renderList();
  }catch(e){
    console.error(e);
    document.getElementById('si').innerHTML='<span style="color:#f87171">✕ 連線失敗</span>';
  }finally{
    btn.disabled=false; btn.textContent='↺ 更新盤口';
  }
}

function renderList(){
  const el=document.getElementById('glist');
  el.innerHTML=games.map(g=>`
    <div class="game-card" onclick="selectGame('${g.game_id}')">
      <div class="gc-teams">${g.away} VS ${g.home}</div>
      <div class="gc-total">${g.latest?.total ?? '—'}</div>
    </div>`).join('');
}

function selectGame(id){
    const g=games.find(g=>g.game_id===id);
    if(g) document.getElementById('dpanel').innerHTML=`<div>${g.home} 對戰數據</div>`;
}

// 保持你原有的其他邏輯...
window.onload=fetchData;
</script>
</body>
</html>
