<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Pinnacle Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-5">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">MLB 盤口即時監控</h1>
        <div id="status-box" class="p-3 mb-4 rounded bg-gray-800">
            狀態: <span id="status-text" class="text-yellow-400">連線中...</span>
        </div>
        
        <table class="w-full text-sm text-left">
            <thead class="text-xs uppercase bg-gray-700">
                <tr>
                    <th class="px-4 py-2">對戰隊伍</th>
                    <th class="px-4 py-2">目前總分 (Total)</th>
                    <th class="px-4 py-2">訊號 (Signal)</th>
                </tr>
            </thead>
            <tbody id="game-table" class="divide-y divide-gray-700">
                </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://mlb-pinnacle-tracker.onrender.com';

        async function loadGames() {
            const statusText = document.getElementById('status-text');
            const tableBody = document.getElementById('game-table');

            try {
                // cache: 'no-store' 確保強制讀取最新資料
                const res = await fetch(`${API_URL}/games`, { cache: 'no-store' });
                
                if (!res.ok) throw new Error(`HTTP 錯誤: ${res.status}`);
                
                const data = await res.json();
                statusText.textContent = '資料已更新 (' + new Date().toLocaleTimeString() + ')';
                statusText.className = 'text-green-400';

                // 清空並寫入資料
                tableBody.innerHTML = '';
                data.forEach(game => {
                    const row = `
                        <tr class="hover:bg-gray-800">
                            <td class="px-4 py-2">${game.away} @ ${game.home}</td>
                            <td class="px-4 py-2">${game.latest?.total || 'N/A'}</td>
                            <td class="px-4 py-2 font-bold ${game.signal?.total?.includes('STEAM') ? 'text-red-400' : 'text-blue-400'}">
                                ${game.signal?.total || '-'}
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (err) {
                console.error("連線錯誤細節:", err);
                statusText.textContent = '連線失敗，請檢查 Render 是否正常運作';
                statusText.className = 'text-red-400';
            }
        }

        // 每 60 秒自動刷新
        loadGames();
        setInterval(loadGames, 60000);
    </script>
</body>
</html>
