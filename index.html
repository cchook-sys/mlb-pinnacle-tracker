<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b1120; color: #cbd5e1; font-family: monospace; }
        .panel { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-2 h-screen flex flex-col text-[11px]">
    <header class="flex justify-between items-center px-4 py-2 border-b border-slate-700 bg-[#0f172a]">
        <h1 class="font-bold text-white tracking-widest text-sm">⚾ MLB PINNACLE TRACKER</h1>
        <div id="status" class="text-sky-400">連線成功</div>
    </header>

    <main class="flex-grow grid grid-cols-5 gap-2 p-2 overflow-hidden">
        <div id="games-list" class="col-span-1 panel overflow-y-auto p-2 space-y-1">載入中...</div>
        <div class="col-span-4 grid grid-rows-3 gap-2">
            <div class="row-span-2 panel p-4 flex flex-col">
                <h2 id="game-title" class="text-white font-bold mb-2">請點擊左側賽事</h2>
                <div class="flex-grow min-h-0"><canvas id="oddsChart"></canvas></div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="panel p-4" id="details-panel">數據監控中...</div>
                <div class="panel p-4" id="odds-table">盤口資訊...</div>
            </div>
        </div>
    </main>

    <script>
        let myChart;
        // 關鍵：將網址明確對接到你的 render 網域
        const API_BASE = "https://mlb-pinnacle-tracker.onrender.com";

        async function fetchGames() {
            try {
                const res = await fetch(`${API_BASE}/games`);
                const json = await res.json();
                const list = document.getElementById('games-list');
                // 這裡檢查 API 返回結構
                list.innerHTML = json.data.map(g => `
                    <div onclick="selectGame('${g.id}', '${g.away_team} @ ${g.home_team}')" 
                         class="p-2 bg-slate-800 hover:bg-sky-900 cursor-pointer border-l-2 border-sky-500 rounded">
                        ${g.away_team} @ ${g.home_team}
                    </div>
                `).join('');
            } catch(e) { console.error("抓取失敗", e); }
        }

        async function selectGame(id, title) {
            document.getElementById('game-title').innerText = title;
            const res = await fetch(`${API_BASE}/history/${id}`);
            const data = await res.json();
            
            const ctx = document.getElementById('oddsChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.time),
                    datasets: [{ label: 'Pinnacle', data: data.map(d => d.odds), borderColor: '#38bdf8', borderWidth: 2 }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
        fetchGames();
    </script>
</body>
</html>
