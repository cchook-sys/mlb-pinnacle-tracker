// 1. 優化後的訊號判定邏輯
function sig(snaps) {
    if(!snaps || snaps.length < 2) return { lbl:'觀望', d:0, st:false, pick:null };
    const d = +(snaps[snaps.length-1].total - snaps[0].total).toFixed(1);
    // 蒸氣判斷：變動 >= 0.5
    const isSteam = Math.abs(d) >= 0.5;
    // 推薦判斷：變動 >= 1.0
    const isRec = Math.abs(d) >= 1.0;
    return { 
        lbl: isSteam ? (d > 0 ? '🔥 大分蒸氣' : '🔥 小分蒸氣') : '觀望',
        d, st: isSteam, pick: isSteam ? (d > 0 ? 'OVER' : 'UNDER') : null, rec: isRec
    };
}
