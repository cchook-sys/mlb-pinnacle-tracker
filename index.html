<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Pinnacle 數據量化儀表板 - 實戰完全體</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .card-active { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .tab-active { background-color: #1e293b; border-color: #38bdf8; color: #fff; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-800 pb-4 mb-6 gap-4">
            <div>
                <h1 class="text-xl md:text-3xl font-extrabold text-white tracking-tight flex items-center flex-wrap gap-2">
                    ⚾ MLB Pinnacle 數據量化
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20">🟢 已連線</span>
                    <span id="tw-clock" class="text-xs bg-slate-800 text-emerald-400 px-3 py-1 rounded-full border border-slate-700 font-mono font-bold tracking-wider">🕒 資料最後更新時間: --/-- --:--:--</span>
                </h1>
            </div>
            
            <div class="flex gap-2 w-full md:w-auto justify-end">
                <button id="btn-live" onclick="switchMode('live')" class="tab-active border border-gray-800 px-4 py-2 rounded-lg text-sm font-bold cursor-pointer">🔥 即時監控看盤</button>
                <button id="btn-history" onclick="switchMode('history')" class="bg-gray-900 border border-gray-800 text-gray-400 px-4 py-2 rounded-lg text-sm font-bold cursor-pointer hover:text-white">📊 昨日歷史結算分析</button>
            </div>
        </div>

        <div id="live-view" class="grid grid-cols-12 gap-6">
            <div class="col-span-12 md:col-span-5 space-y-2 max-h-[80vh] overflow-y-auto pr-1" id="games-list">
                <div class="text-center py-12 text-xs text-gray-500">🔄 正在同步全市場已放盤賽事...</div>
            </div>
            
            <div class="col-span-12 md:col-span-7 bg-gray-900/50 border border-gray-800 rounded-xl p-6 max-h-[80vh] overflow-y-auto sticky top-4" id="chart-container">
                <div id="chart-placeholder" class="text-center py-24 text-gray-500">
                    <span class="text-4xl mb-2">📊</span>
                    <p class="text-sm">請點擊左側賽事觀看資金流向折線圖</p>
                </div>
                
                <div id="chart-content" class="hidden space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                        <div>
                            <h2 id="selected-matchup" class="text-lg font-bold text-white leading-tight">--- VS ---</h2>
                            <div id="selected-time-panel" class="text-xs text-gray-400 mt-1 space-y-0.5 font-mono">
                                <p id="selected-time-est">🇺🇸 美東開賽: --</p>
                                <p id="selected-time-tw" class="text-sky-400 font-bold">🇹🇼 台灣時間: --</p>
                            </div>
                        </div>
                    </div>

                    <div id="final-verdict-panel" class="p-4 rounded-xl border flex flex-col gap-1.5 font-sans shadow-lg">
                        <div class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">🎯 大數據量化・實戰最終下單推薦</div>
                        <div id="final-verdict-title" class="text-xl md:text-2xl font-black tracking-wide">--</div>
                        <div id="final-verdict-desc" class="text-xs text-gray-300 leading-relaxed font-medium mt-0.5">--</div>
                    </div>

                    <div id="feedback-calibration-panel" class="bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-lg flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-xl">📊</span>
                            <div>
                                <div class="text-white text-xs font-bold">歷史同特蹤動態校正回饋</div>
                                <div id="calibration-text" class="text-emerald-400 text-xs font-mono mt-0.5">--</div>
                            </div>
                        </div>
                        <span id="calibration-rating" class="font-black text-[10px] px-1.5 py-0.5 rounded">--</span>
                    </div>

                    <div id="betting-guide-panel" class="bg-sky-500/10 border border-sky-500/20 p-3 rounded-lg font-mono">
                        <div class="text-sky-400 text-xs font-black flex items-center gap-1 mb-1">⚡ 實戰盤口風控下單指引</div>
                        <div id="betting-guide-text" class="text-white text-[11px] leading-relaxed">--</div>
                    </div>
                    
                    <div class="relative w-full h-[240px]"><canvas id="historyChart"></canvas></div>
                </div>
            </div>
        </div>

        <div id="history-view" class="hidden bg-gray-900 border border-gray-800 rounded-xl p-4 overflow-x-auto">
            <table class="w-full text-left border-collapse font-mono text-xs">
                <thead>
                    <tr class="border-b border-gray-800 text-gray-400">
                        <th class="p-3">對戰組合 / 雙時區時間</th>
                        <th class="p-3">初盤 -> 終盤 (大小)</th>
                        <th class="p-3">資金流向 (Delta)</th>
                        <th class="p-3">完賽比分</th>
                        <th class="p-3 text-sky-400">📊 預測校正驗證</th>
                    </tr>
                </thead>
                <tbody id="history-table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = "https://mlb-pinnacle-tracker.onrender.com";
        let fetchedGames = [];
        let myChart = null;

        function formatDualTime(utcStr) {
            try {
                const dateObj = new Date(utcStr);
                const twTime = dateObj.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
                const estTime = new Date(dateObj.getTime() - (4 * 60 * 60 * 1000)).toISOString().substring(11, 16);
                return { est: `${estTime} ET`, tw: `${twTime} (台)` };
            } catch {
                return { est: '--:-- ET', tw: '--/-- --:--' };
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
        });

        function getCompactBadge(game) {
            const deltaTotal = game.delta ? game.delta.total : 0;
            const deltaML = game.delta ? game.delta.ml_home : 0;
            if (Math.abs(deltaTotal) >= 0.5 || deltaML <= -15) return `<span class="bg-rose-500 text-white font-black text-[10px] px-2 py-0.5 rounded shadow animate-pulse">🎯 進場</span>`;
            if (Math.abs(deltaTotal) >= 0.25 || Math.abs(deltaML) >= 5) return `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold text-[10px] px-2 py-0.5 rounded">⚠️ 觀察</span>`;
            return `<span class="bg-gray-800 text-gray-500 text-[10px] px-2 py-0.5 rounded">💤 觀望</span>`;
        }

        function switchMode(mode) {
            if (mode === 'live') {
                document.getElementById('live-view').classList.remove('hidden');
                document.getElementById('history-view').classList.add('hidden');
                document.getElementById('btn-live').classList.add('tab-active');
                document.getElementById('btn-history').classList.remove('tab-active');
            } else {
                document.getElementById('live-view').classList.add('hidden');
                document.getElementById('history-view').classList.remove('hidden');
                document.getElementById('btn-live').classList.remove('tab-active');
                document.getElementById('btn-history').classList.add('tab-active');
                loadHistory();
            }
        }

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE}/games?nocache=${Date.now()}`);
                const parsedPayload = await res.json();
                
                if(parsedPayload.system_updated_at){
                    document.getElementById("tw-clock").innerText = `🕒 資料最後更新時間: ${parsedPayload.system_updated_at}`;
                }
                
                fetchedGames = parsedPayload.data;
                const container = document.getElementById("games-list");
                container.innerHTML = "";

                if (!fetchedGames || fetchedGames.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 text-xs text-gray-500">📭 目前官方尚未放出任何最新美金盤口。</div>`;
                    return;
                }

                fetchedGames.forEach(g => {
                    const times = formatDualTime(g.commence_time);
                    const card = document.createElement("div");
                    card.className = "bg-gray-900 border border-gray-800 rounded-lg p-4 cursor-pointer hover:border-gray-700 transition-all flex flex-col justify-between relative";
                    card.onclick = () => selectGame(g.game_id);
                    card.id = `card-${g.game_id}`;
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-1.5">
                                <div class="text-[10px] text-gray-500 font-mono leading-tight">
                                    🇺🇸 ${times.est}<br>
                                    <span class="text-sky-500 font-bold">🇹🇼 ${times.tw}</span>
                                </div>
                                ${getCompactBadge(g)}
                            </div>
                            <div class="text-sm font-bold text-white mt-1">${g.away} VS ${g.home}</div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs text-gray-400 mt-2 font-mono border-t border-gray-800/40 pt-2">
                            <div>大小/受讓基準: <span class="text-sky-400 font-bold">${g.open.total || '--'}</span></div>
                            <div>大小/讓分幅度: <span class="text-amber-400 font-bold">${g.delta.total > 0 ? '+'+g.delta.total : g.delta.total}</span></div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch {
                document.getElementById("games-list").innerHTML = `<div class="text-center py-12 text-red-400 text-xs">❌ 伺服器通訊異常，請重新整理</div>`;
            }
        }

        function selectGame(gid) {
            const game = fetchedGames.find(g => g.game_id === gid);
            if (!game) return;
            document.querySelectorAll("#games-list > div").forEach(c => c.classList.remove("card-active"));
            document.getElementById(`card-${gid}`).classList.add("card-active");
            document.getElementById("chart-placeholder").classList.add("hidden");
            document.getElementById("chart-content").classList.remove("hidden");
            document.getElementById("selected-matchup").innerText = `${game.away} VS ${game.home}`;
            
            const times = formatDualTime(game.commence_time);
            document.getElementById("selected-time-est").innerText = `🇺🇸 美東開賽: ${times.est}`;
            document.getElementById("selected-time-tw").innerText = `🇹🇼 台灣時間: ${times.tw}`;

            const calibrationText = document.getElementById("calibration-text");
            const calibrationRating = document.getElementById("calibration-rating");
            const guideText = document.getElementById("betting-guide-text");
            const verdictPanel = document.getElementById("final-verdict-panel");
            const verdictTitle = document.getElementById("final-verdict-title");
            const verdictDesc = document.getElementById("final-verdict-desc");

            const totalSignal = game.signal ? game.signal.total : "FLAT";
            const currentTotal = game.latest ? game.latest.total : 0;
            const deltaTotal = game.delta ? game.delta.total : 0;
            const deltaML = game.delta ? game.delta.ml_home : 0;

            if (totalSignal === "STEAM_OVER" || deltaML <= -15) {
                verdictPanel.className = "p-4 rounded-xl border border-rose-500 bg-rose-500/10 flex flex-col gap-1.5 font-sans shadow-lg animate-pulse";
                verdictTitle.className = "text-xl md:text-2xl font-black tracking-wide text-rose-400";
                verdictTitle.innerHTML = `🔥 實戰判定：滿足進場指標`;
                verdictDesc.innerHTML = `<b>量化理由：</b> 大資金有顯著單邊灌注突破（大小變動 ${deltaTotal} / 獨贏變動 ${deltaML}）。建議臨場切入，若怕水位被卡死，可靈活搭配降階的替代讓分或大小玩過關！`;
            } else if (totalSignal === "STEAM_UNDER") {
                verdictPanel.className = "p-4 rounded-xl border border-sky-500 bg-sky-500/10 flex flex-col gap-1.5 font-sans shadow-lg";
                verdictTitle.className = "text-xl md:text-2xl font-black tracking-wide text-sky-400";
                verdictTitle.innerHTML = `❄️ 實戰判定：搶進低位市場`;
                verdictDesc.innerHTML = `<b>量化理由：</b> 核心資金拋售。建議利用替代受讓或加分盤口進場，鎖定防守空間，非常適合當作串關穩當基底。`;
            } else {
                verdictPanel.className = "p-4 rounded-xl border border-gray-700 bg-gray-800/20 flex flex-col gap-1.5 font-sans shadow-lg";
                verdictTitle.className = "text-xl md:text-2xl font-black tracking-wide text-gray-400";
                verdictTitle.innerHTML = `💤 實戰判定：【 空 倉 觀 望 】`;
                verdictDesc.innerHTML = `<b>量化理由：</b> 盤口目前處於平穩死水狀態。依歷史回測，此時盲目重注最容易落入誘盤盲區，建議按兵不動，等臨場 30 分鐘資金突破。`;
            }

            calibrationText.innerText = "當前狀態 -> 異步數據活水機制已同步通電運作中";
            calibrationRating.innerText = "即時監控中";
            calibrationRating.className = "bg-emerald-500 text-gray-950 font-black text-[10px] px-1.5 py-0.5 rounded";
            guideText.innerHTML = `👉 <b>過關策略指引：</b> 優先挑選左側顯示具有「🎯 進場」紅色標籤的場次。結合折線圖趨勢，挑選兩場 Delta 大於 0.5 且臨場方向一致的降階替代盤口，進行 2 串 1 或 3 串 1 實戰過關。`;

            const labels = game.history.map(h => h.ts.substring(11,16));
            if(myChart) myChart.destroy();
            myChart = new Chart(document.getElementById('historyChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '大小/基準變動', data: game.history.map(h => h.total), borderColor: '#38bdf8', tension: 0.1, yAxisID: 'y1' },
                        { label: '獨贏/讓分水位', data: game.history.map(h => h.ml_home), borderColor: '#fbbf24', borderDash:[5,5], yAxisID: 'y2' }
                    ]
                },
                options: { scales: { y1: { position: 'left' }, y2: { position: 'right', grid: { drawOnChartArea: false } } } }
            });
        }

        async function loadHistory() {
            const tbody = document.getElementById("history-table-body");
            tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">🔄 正在加載歷史對答案大數據...</td></tr>`;
            try {
                const res = await fetch(`${API_BASE}/analytics/dataset?nocache=${Date.now()}`);
                const dataset = await res.json();
                tbody.innerHTML = "";

                dataset.forEach(row => {
                    let verifyHtml = "";
                    if(row.total_changed_delta >= 0.5) {
                        verifyHtml += row.closing_total_result === "OVER" ? `<div class="text-emerald-400 font-bold mb-1">🎯 大分精準</div>` : `<div class="text-rose-400 mb-1">❌ 大分失準</div>`;
                    } else if(row.total_changed_delta <= -0.5) {
                        verifyHtml += row.closing_total_result === "UNDER" ? `<div class="text-emerald-400 font-bold mb-1">🎯 小分精準</div>` : `<div class="text-rose-400 mb-1">❌ 小分失準</div>`;
                    }
                    if (row.ml_winner_result === "HOME") verifyHtml += `<div class="text-amber-400 text-[11px]">🏠 主隊贏盤</div>`;
                    else if (row.ml_winner_result === "AWAY") verifyHtml += `<div class="text-slate-400 text-[11px]">✈️ 客隊贏盤</div>`;

                    const times = formatDualTime(row.commence_time);

                    const tr = document.createElement("tr");
                    tr.className = `border-b border-gray-800/60 hover:bg-gray-900/40 transition-all`;
                    tr.innerHTML = `
                        <td class="p-3 leading-tight">
                            <div class="font-bold text-white mb-0.5">${row.away} VS ${row.home}</div>
                            <div class="text-[10px] text-gray-500 font-normal">
                                美東: ${times.est}<br>
                                <span class="text-sky-400">台灣: ${times.tw}</span>
                            </div>
                        </td>
                        <td class="p-3 text-gray-400">初大小: <b>${row.opening_total||'--'}</b> -> 終: <b>${row.closing_total||'--'}</b></td>
                        <td class="p-3 font-mono text-sky-400 font-bold">大小變動: ${row.total_changed_delta}</td>
                        <td class="p-3 text-emerald-400 font-black text-sm">${row.final_away_score} : ${row.final_home_score}</td>
                        <td class="p-3 space-y-1">${verifyHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-400">❌ 載入失敗</td></tr>`;
            }
        }
    </script>
</body>
</html>
