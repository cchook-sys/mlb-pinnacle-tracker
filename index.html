<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLBENTRY - Pinnacle 盤口監控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* 保持你的原始樣式設計 */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#07090f;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
:root{--bg:#07090f;--surface:#0d1117;--card:#0d1b2e;--border:#1e3a5f;--border2:#131d2e;--text:#e6edf3;--muted:#8b949e;--dim:#4b5563;--accent:#39ff14;--blue:#3b82f6;--orange:#f97316;--cyan:#38bdf8;--red:#f87171;--yellow:#fbbf24;--green:#4ade80;--purple:#c084fc;}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;flex-shrink:0;}
.tabbar{background:var(--bg);border-bottom:1px solid var(--border2);padding:7px 16px;display:flex;gap:6px;flex-shrink:0;}
.main-today{display:flex;flex:1;overflow:hidden;}
.sidebar{width:360px;overflow-y:auto;border-right:1px solid var(--border2);display:flex;flex-direction:column;}
.detail-panel{flex:1;overflow-y:auto;padding:18px 20px;}
.gc{padding:10px 13px;border-bottom:1px solid var(--border2);cursor:pointer;}
.gc:hover{background:rgba(255,255,255,.025);}
.btn{border:none;cursor:pointer;padding:7px 13px;border-radius:5px;font-weight:700;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="logo">MLB<b>ENTRY</b></div>
      <button class="btn" onclick="fetchData()">更新盤口</button>
    </div>
  </div>
  <div class="tabbar">
    <button class="tab on" id="t1" onclick="swTab('today')">📡 今日盤口</button>
    <button class="tab" id="t2" onclick="swTab('history')">📊 昨日結算</button>
  </div>
  <div class="main-today" id="vt">
    <div class="sidebar" id="glist"></div>
    <div class="detail-panel" id="dpanel">點擊場次查看詳細分析</div>
  </div>
</div>

<script>
const API = 'https://mlb-pinnacle-tracker.onrender.com';
let games = [], selId = null;
let corrOpen = false; // 全域變數，僅在此定義一次

function swTab(t) {
    const isT = (t === 'today');
    document.getElementById('vt').style.display = isT ? 'flex' : 'none';
}

function toggleCorr() {
    corrOpen = !corrOpen;
    const body = document.getElementById('corr-body');
    if (body) body.style.display = corrOpen ? 'block' : 'none';
}

async function fetchData() {
    try {
        const r = await fetch(API + '/games');
        if (!r.ok) throw new Error('API Error');
        games = await r.json();
        renderList();
    } catch (e) {
        document.getElementById('glist').innerHTML = "連線失敗: " + e.message;
    }
}

function renderList() {
    const el = document.getElementById('glist');
    if (!games.length) { el.innerHTML = '無資料'; return; }
    el.innerHTML = games.map(g => `
        <div class="gc" onclick="selGame('${g.game_id}')">
            <div style="font-weight:800;">${g.away} VS ${g.home}</div>
            <div style="font-size:11px;color:#8b949e;">最新總分: ${g.latest?.total || '—'}</div>
        </div>
    `).join('');
}

function selGame(id) {
    selId = id;
    const g = games.find(x => x.game_id === id);
    if (g) {
        document.getElementById('dpanel').innerHTML = `
            <h3>${g.away} vs ${g.home}</h3>
            <p>比賽時間: ${new Date(g.commence_time).toLocaleString()}</p>
        `;
    }
}

window.onload = fetchData;
</script>
</body>
</html>
