<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b1120; color: #cbd5e1; }
        .panel { background-color: #161e2e; border: 1px solid #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen p-4 gap-4 overflow-hidden font-sans">
    <div id="sidebar" class="w-1/3 flex flex-col gap-2 overflow-y-auto">
        <h2 class="text-white font-bold p-2">即時賽事</h2>
    </div>

    <div class="flex-1 flex flex-col">
        <div class="panel p-6 flex-grow">
            <h2 id="chart-title" class="text-white font-bold text-lg mb-4">請從左側選擇比賽</h2>
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        let myChart;
        async function init() {
            const res = await fetch("http://localhost:8000/games");
            const games = await res.json();
            const sidebar = document.getElementById('sidebar');
            games.forEach(g => {
                sidebar.innerHTML += `
                    <div onclick="renderChart('${g.id}', '${g.teams}')" class="panel p-4 cursor-pointer hover:bg-slate-800 transition">
                        <div class="text-white font-medium">${g.teams}</div>
                        <div class="text-xs text-slate-500">${g.time}</div>
                    </div>
                `;
            });
        }

        async function renderChart(id, title) {
            document.getElementById('chart-title').innerText = title;
            const res = await fetch(`http://localhost:8000/history/${id}`);
            const data = await res.json();
            
            const ctx = document.getElementById('myChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [
                        { label: '大小分', data: data.over_under, yAxisID: 'y', borderColor: '#38bdf8', borderWidth: 2, stepped: true },
                        { label: '主獨贏', data: data.win_odds, yAxisID: 'y1', borderColor: '#fbbf24', borderDash: [5, 5], borderWidth: 2 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { position: 'left', ticks: { color: '#38bdf8' }, grid: { color: '#1e293b' } },
                        y1: { position: 'right', ticks: { color: '#fbbf24' }, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }
        init();
    </script>
</body>
</html>
