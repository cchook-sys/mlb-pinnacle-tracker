<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLBENTRY - Pinnacle 盤口監控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* 你的原始 CSS 已全數保留 */
*{box-sizing:border-box;margin:0;padding:0;}
:root{ --bg:#0a0f1a; --surface:#111827; --card:#0d1b2e; --border:#1e3a5f; --text:#e6edf3; --dim:#4b5563; --accent:#39ff14; --blue:#3b82f6; --orange:#f97316; --cyan:#38bdf8; }
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;}
.logo{font-size:22px;font-weight:900;letter-spacing:3px;} .logo span{color:var(--accent);}
.btn{cursor:pointer;font-family:inherit;font-weight:700;font-size:11px;padding:7px 14px;border-radius:5px;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="logo">MLB<span>ENTRY</span></div>
    <div id="status-box" style="font-size:11px;color:var(--dim)">狀態: <span id="si">連線中...</span></div>
  </div>
  <button class="btn" style="background:#1d4ed8;color:#fff;" id="rbtn" onclick="fetchData()">↺ 更新盤口</button>
</div>

<div class="main" style="display:flex; height: 90vh;">
  <div class="sidebar" id="glist" style="width:360px; overflow-y:auto; border-right:1px solid var(--border);"></div>
  <div class="detail" id="dpanel" style="flex:1; padding:20px;">選擇場次查看分析</div>
</div>

<script>
const API='https://mlb-pinnacle-tracker.onrender.com';
let games=[];

async function fetchData(){
  const btn = document.getElementById('rbtn');
  const si = document.getElementById('si');
  btn.disabled = true; 
  btn.textContent = '更新中...';
  
  try {
    // 增加 mode: 'cors' 解決跨網域問題，cache: 'no-store' 確保資料最新
    const r = await fetch(`${API}/games`, { 
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        headers: { 'Accept': 'application/json' }
    });
    
    if(!r.ok) throw new Error('伺服器回應錯誤: ' + r.status);
    
    games = await r.json();
    si.innerHTML = '<span style="color:var(--accent)">● 已連線</span>';
    renderList();
  } catch(e) {
    console.error("Fetch Data Error:", e);
    si.innerHTML = '<span style="color:var(--red)">✕ 連線失敗</span>';
    alert("連線失敗，請檢查網路或 Render 後端是否在運作中。");
  } finally {
    btn.disabled = false;
    btn.textContent = '↺ 更新盤口';
  }
}

function renderList(){
  const el = document.getElementById('glist');
  if(!games.length) { el.innerHTML = '<div style="padding:20px;color:var(--dim)">目前無盤口數據</div>'; return; }
  
  el.innerHTML = games.map(g => `
    <div style="padding:15px; border-bottom:1px solid var(--border); cursor:pointer;" onclick="selectGame('${g.game_id}')">
      <div style="font-weight:800">${g.away} VS ${g.home}</div>
      <div style="color:var(--cyan)">總分: ${g.latest?.total ?? '—'}</div>
    </div>`).join('');
}

function selectGame(id){
    const g = games.find(g => g.game_id === id);
    if(g) document.getElementById('dpanel').innerHTML = `<h3>${g.home} 對戰詳細數據</h3><p>數據已載入。</p>`;
}

// 初始化
window.onload = fetchData;
</script>
</body>
</html>
