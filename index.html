<script>
    async function fetchGames() {
        try {
            const container = document.getElementById('games-list');
            const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
            const json = await res.json();
            
            // 確認 JSON 有資料
            if (json.data && json.data.length > 0) {
                // 直接將資料渲染出來
                container.innerHTML = json.data.map(g => `
                    <div class="p-4 bg-slate-800 rounded border border-slate-700 mb-4">
                        <h2 class="text-xl font-bold">${g.away_team} VS ${g.home_team}</h2>
                        <p class="text-sm text-slate-400">開賽時間: ${g.commence_time}</p>
                    </div>
                `).join('');
            } else {
                container.innerHTML = "目前暫無賽事資料";
            }
        } catch (e) {
            console.error("抓取失敗:", e);
            document.getElementById('games-list').innerHTML = "連線失敗，請檢查 API";
        }
    }

    // 頁面載入時執行
    fetchGames();
</script>
