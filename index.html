<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBENTRY - Pinnacle 盤口監控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg:#0a0f1a; --surface:#111827; --card:#0d1b2e; --border:#1e3a5f; --text:#e6edf3; --dim:#4b5563; --accent:#39ff14; --blue:#3b82f6; --orange:#f97316; --cyan:#38bdf8; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 3px; color: #fff; }
        .logo span { color: var(--accent); }
        .btn { cursor: pointer; padding: 8px 15px; border-radius: 5px; border: none; font-weight: bold; background: #1d4ed8; color: #fff; transition: 0.2s; }
        .btn:hover { background: #2563eb; }
        .main { display: flex; flex: 1; overflow: hidden; }
        #glist { width: 360px; overflow-y: auto; border-right: 1px solid var(--border); }
        #dpanel { flex: 1; padding: 25px; overflow-y: auto; display: flex; align-items: center; justify-content: center; }
        .game-item { padding: 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .game-item:hover { background: #111827; }
        .card-style { background: #0d1b2e; padding: 30px; border-radius: 12px; border: 1px solid #1e3a5f; width: 100%; max-width: 600px; }
    </style>
</head>
<body>

<div class="topbar">
    <div>
        <div class="logo">MLB<span>ENTRY</span></div>
        <div id="status" style="font-size: 11px; color: var(--dim);">狀態: <span id="si">連線中...</span></div>
    </div>
    <button class="btn" onclick="fetchData()">↺ 更新盤口</button>
</div>

<div class="main">
    <div id="glist"></div>
    <div id="dpanel"><div style="color:var(--dim)">請點擊左側場次查看數據</div></div>
</div>

<script>
const API = 'https://mlb-pinnacle-tracker.onrender.com';
let games = [];

async function fetchData() {
    const si = document.getElementById('si');
    si.textContent = '抓取中...';
    try {
        const r = await fetch(`${API}/games`, { mode: 'cors', cache: 'no-store' });
        games = await r.json();
        si.innerHTML = '<span style="color:#39ff14">● 已連線</span>';
        
        const list = document.getElementById('glist');
        list.innerHTML = games.map(g => `
            <div class="game-item" onclick="selectGame('${g.game_id}')">
                <div style="font-weight:bold; margin-bottom:5px;">${g.away} VS ${g.home}</div>
                <div style="color:var(--cyan)">總分: ${g.latest?.total ?? '--'}</div>
            </div>
        `).join('');
    } catch(e) {
        si.textContent = '✕ 連線錯誤';
        console.error(e);
    }
}

function selectGame(id) {
    const g = games.find(g => g.game_id === id);
    if (!g) return;
    document.getElementById('dpanel').innerHTML = `
        <div class="card-style">
            <h2 style="margin-bottom:20px; border-bottom:1px solid #1e3a5f; padding-bottom:10px;">${g.away} VS ${g.home}</h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <div><p style="color:var(--dim); font-size:12px">目前總分</p><p style="font-size:32px; font-weight:900">${g.latest?.total ?? '--'}</p></div>
                <div><p style="color:var(--dim); font-size:12px">開盤總分</p><p style="font-size:32px; font-weight:900; color:var(--dim)">${g.open?.total ?? '--'}</p></div>
                <div style="color:var(--orange)">Over 賠率: ${g.latest?.over_juice ?? '--'}</div>
                <div style="color:var(--cyan)">Under 賠率: ${g.latest?.under_juice ?? '--'}</div>
            </div>
            <p style="margin-top:20px; color:var(--dim); font-size:10px;">最後更新: ${new Date().toLocaleString()}</p>
        </div>
    `;
}

window.onload = fetchData;
</script>
</body>
</html>
