<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b1120; color: #cbd5e1; }
        .panel { background-color: #161e2e; border: 1px solid #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="p-2 h-screen flex gap-2 overflow-hidden">
    
    <div id="sidebar" class="w-1/4 panel overflow-y-auto p-2">
        <h2 class="text-white font-bold text-sm mb-4">即時賽事</h2>
        <div id="game-list">讀取中...</div>
    </div>

    <div class="flex-1 panel p-4">
        <canvas id="oddsChart"></canvas>
    </div>

    <script>
        const API_BASE_URL = "https://mlb-pinnacle-tracker.onrender.com";

        async function init() {
            try {
                const res = await fetch(`${API_BASE_URL}/games`);
                const games = await res.json();
                document.getElementById('game-list').innerHTML = games.map(g => `
                    <div onclick="renderChart('${g.id}')" class="panel p-3 cursor-pointer hover:bg-slate-700">
                        ${g.away_team} vs ${g.home_team}
                    </div>
                `).join('');
            } catch(e) { document.getElementById('game-list').innerText = "API連線失敗"; }
        }

        async function renderChart(id) {
            const res = await fetch(`${API_BASE_URL}/history/${id}`);
            const data = await res.json();
            
            const ctx = document.getElementById('oddsChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{ label: '水位的變化', data: data.win_odds, borderColor: '#fbbf24' }]
                }
            });
        }
        init();
    </script>
</body>
</html>
