<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0b1120] text-gray-300 p-4 h-screen flex flex-col">
    <div class="grid grid-cols-12 gap-4 h-full">
        
        <div id="games-list" class="col-span-4 overflow-y-auto space-y-3"></div>

        <div class="col-span-8 bg-[#1e293b] p-4 rounded-lg border border-slate-700">
            <h2 id="chart-title" class="text-white font-bold mb-4">請點擊賽事查看趨勢</h2>
            <canvas id="oddsChart" class="w-full h-96"></canvas>
        </div>
    </div>

    <script>
        let myChart;
        async function fetchGames() {
            const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
            const json = await res.json();
            const list = document.getElementById('games-list');
            
            list.innerHTML = json.data.map(g => `
                <div onclick="selectGame(${JSON.stringify(g).replace(/"/g, '&quot;')})" 
                     class="bg-[#1e293b] p-4 rounded border border-slate-700 cursor-pointer hover:border-sky-500">
                    <div class="text-sm font-bold text-white">${g.away_team} VS ${g.home_team}</div>
                    <div class="flex justify-between mt-2 text-xs">
                        <span>大小: ${g.bookmakers[0].markets[1]?.outcomes[0].point || 0}</span>
                        <span>獨贏: ${g.bookmakers[0].markets[0].outcomes[0].price}</span>
                        <button class="bg-rose-600 px-2 rounded">進場</button>
                    </div>
                </div>
            `).join('');
        }

        function selectGame(g) {
            document.getElementById('chart-title').innerText = `${g.away_team} VS ${g.home_team}`;
            const ctx = document.getElementById('oddsChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            // 雙軸圖表邏輯 (藍色為大小分, 黃色為獨贏水位)
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['15:35', '16:01', '17:45', '23:10'],
                    datasets: [
                        { label: '大小分', data: [7.5, 7.5, 7.5, 7.5], borderColor: '#38bdf8', yAxisID: 'y1' },
                        { label: '獨贏水位', data: [-200, -205, -210, -240], borderColor: '#fbbf24', yAxisID: 'y2' }
                    ]
                },
                options: {
                    scales: { y1: { position: 'left' }, y2: { position: 'right' } }
                }
            });
        }
        fetchGames();
    </script>
</body>
</html>
