<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b1120; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .panel { background-color: #162033; border: 1px solid #2d3748; }
    </style>
</head>
<body class="p-2 h-screen flex flex-col font-mono text-[11px]">
    <header class="flex justify-between items-center px-4 py-2 border-b border-slate-700 bg-[#0f172a]">
        <h1 class="font-bold text-white tracking-widest text-sm">MLB PINNACLE TRACKER</h1>
        <div id="status" class="text-sky-400 text-xs">最後更新: --:--:--</div>
    </header>

    <main class="grid grid-cols-12 gap-2 p-2 h-[calc(100vh-60px)]">
        <div id="games-list" class="col-span-4 overflow-y-auto space-y-1 pr-1"></div>
        
        <div class="col-span-8 flex flex-col gap-2">
            <div class="panel p-4 flex-grow"><canvas id="oddsChart"></canvas></div>
            <div class="panel p-3 text-slate-300" id="odds-details">
                <div class="font-bold mb-1 text-slate-500">盤口詳情:</div>
                <div id="details-text">請點擊賽事查看即時盤口</div>
            </div>
        </div>
    </main>

    <script>
        let myChart;
        let allGames = [];

        async function fetchGames() {
            try {
                const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
                const json = await res.json();
                allGames = json.data;
                document.getElementById("status").innerText = "最後更新: " + (new Date().toLocaleTimeString());
                
                document.getElementById('games-list').innerHTML = allGames.map((g, i) => {
                    const date = new Date(g.commence_time);
                    const pin = g.bookmakers.find(b => b.key === 'pinnacle') || g.bookmakers[0];
                    const h2h = pin?.markets.find(m => m.key === 'h2h')?.outcomes[0].price || '--';
                    return `
                        <div onclick="showDetails(${i})" class="panel p-3 cursor-pointer hover:border-sky-500 transition-all">
                            <div class="font-bold text-white text-xs mb-1">${g.away_team} VS ${g.home_team}</div>
                            <div class="flex justify-between text-[10px] text-slate-400">
                                <span>${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${date.getMinutes()}</span>
                                <span>獨贏: ${h2h}</span>
                            </div>
                        </div>`;
                }).join('');
            } catch(e) { console.log(e); }
        }

        function showDetails(i) {
            const g = allGames[i];
            const pin = g.bookmakers.find(b => b.key === 'pinnacle') || g.bookmakers[0];
            const h2h = pin.markets.find(m => m.key === 'h2h');
            document.getElementById('details-text').innerText = 
                h2h.outcomes.map(o => o.name + ': ' + o.price).join(' | ');

            const ctx = document.getElementById('oddsChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: ['現在'], datasets: [{ label: 'Pinnacle 水位', data: [h2h.outcomes[0].price], borderColor: '#38bdf8' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
        fetchGames();
    </script>
</body>
</html>
