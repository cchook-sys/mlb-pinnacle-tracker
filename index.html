<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b1120; color: #e2e8f0; font-family: sans-serif; }
        .panel { background-color: #162033; border: 1px solid #2d3748; border-radius: 4px; }
    </style>
</head>
<body class="p-2 h-screen flex flex-col font-mono text-[11px]">
    <header class="flex justify-between px-4 py-2 border-b border-slate-700 bg-[#0f172a]">
        <h1 class="font-bold text-white text-sm">MLB PINNACLE TRACKER</h1>
        <div id="status" class="text-sky-400">連線中...</div>
    </header>

    <main class="grid grid-cols-12 gap-2 p-2 h-[calc(100vh-60px)]">
        <div id="games-list" class="col-span-4 overflow-y-auto space-y-2 pr-1"></div>
        <div class="col-span-8 flex flex-col gap-2">
            <div class="panel p-4 flex-grow"><canvas id="oddsChart"></canvas></div>
            <div class="panel p-4 h-32" id="odds-details">點擊左側賽事查看盤口</div>
        </div>
    </main>

    <script>
        let myChart;
        // 使用全域變數儲存所有賽事數據
        let allGames = [];

        async function fetchGames() {
            const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
            const json = await res.json();
            allGames = json.data;
            document.getElementById("status").innerText = "更新: " + (new Date().toLocaleTimeString());
            
            const list = document.getElementById('games-list');
            list.innerHTML = allGames.map((g, index) => `
                <div onclick="handleGameClick(${index})" class="panel p-3 cursor-pointer hover:border-sky-500 transition-colors">
                    <div class="font-bold text-white">${g.away_team} VS ${g.home_team}</div>
                    <div class="flex justify-between text-slate-400 mt-1">
                        <span>${new Date(g.commence_time).toLocaleDateString()}</span>
                        <span class="bg-rose-900 px-1 rounded text-white">進場</span>
                    </div>
                </div>
            `).join('');
        }

        function handleGameClick(index) {
            const g = allGames[index];
            const pin = g.bookmakers.find(b => b.key === 'pinnacle') || g.bookmakers[0];
            const h2h = pin.markets.find(m => m.key === 'h2h');
            
            // 渲染右側盤口
            document.getElementById('odds-details').innerHTML = `
                <div class="font-bold text-white">盤口: ${g.away_team} vs ${g.home_team}</div>
                <div class="mt-2 text-sky-400">獨贏: ${h2h.outcomes.map(o => o.name + ': ' + o.price).join(' | ')}</div>
            `;

            // 渲染圖表
            const ctx = document.getElementById('oddsChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: ['Now'], datasets: [{ label: 'Pinnacle', data: [h2h.outcomes[0].price], borderColor: '#38bdf8' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
        fetchGames();
    </script>
</body>
</html>
