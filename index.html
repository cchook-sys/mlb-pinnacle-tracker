<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #1e293b; border-right: 1px solid #334155; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="p-4 h-screen flex flex-col">
    
    <header class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h1 class="text-xl font-bold text-white flex items-center gap-2">
            ⚾ <span class="tracking-wider">MLB PINNACLE MONITOR</span>
        </h1>
        <div id="status" class="text-sm font-mono text-sky-400">系統連接中...</div>
    </header>

    <main class="flex-grow grid grid-cols-5 gap-4 overflow-hidden">
        
        <div class="sidebar col-span-1 rounded-xl p-3 overflow-y-auto">
            <h2 class="text-[10px] font-bold text-slate-400 uppercase mb-3 px-2 tracking-widest">Today's Games</h2>
            <div id="games-list" class="space-y-2"></div>
        </div>

        <div class="col-span-4 grid grid-rows-3 gap-4">
            <div class="card row-span-2 p-6 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="game-title" class="text-xl font-bold text-white">請選擇比賽</h2>
                    <span class="px-3 py-1 bg-green-950 text-green-400 text-xs font-bold rounded border border-green-800">LIVE</span>
                </div>
                <div class="flex-grow min-h-0"><canvas id="oddsChart"></canvas></div>
            </div>

            <div id="odds-table" class="grid grid-cols-2 gap-4">
                <div class="p-4 bg-slate-950 rounded-lg border border-slate-700 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] uppercase text-slate-400 font-bold">客隊水位</p>
                        <p id="away-odds" class="text-2xl font-black text-sky-400">-- <span class="text-xs font-normal opacity-50">(--)</span></p>
                    </div>
                </div>
                <div class="p-4 bg-slate-950 rounded-lg border border-slate-700 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] uppercase text-slate-400 font-bold">主隊水位</p>
                        <p id="home-odds" class="text-2xl font-black text-amber-400">-- <span class="text-xs font-normal opacity-50">(--)</span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let myChart;
        document.addEventListener("DOMContentLoaded", fetchGames);

        async function fetchGames() {
            try {
                const res = await fetch("https://mlb-pinnacle-tracker.onrender.com/games");
                const json = await res.json();
                document.getElementById("status").innerText = "最後更新: " + (json.last_update || "--:--:--");
                const list = document.getElementById('games-list');
                list.innerHTML = json.data.map(g => `
                    <div onclick="selectGame('${g.id}', '${g.away_team} @ ${g.home_team}', '${g.away_team}', '${g.home_team}')" 
                         class="p-3 bg-slate-800 rounded cursor-pointer hover:bg-sky-950 border-l-4 border-sky-500 transition-all">
                        <div class="text-xs font-bold truncate text-slate-200">${g.away_team} @ ${g.home_team}</div>
                    </div>
                `).join('');
            } catch(e) { console.error("初始化失敗:", e); }
        }

        window.selectGame = async function(id, title, away, home) {
            document.getElementById('game-title').innerText = title;
            const res = await fetch(`https://mlb-pinnacle-tracker.onrender.com/history/${id}`);
            const data = await res.json();
            
            // 更新數據框
            document.getElementById('away-odds').innerHTML = `${away.split(' ').pop()}: -150 <span class="text-[10px] opacity-50">(-3)</span>`;
            document.getElementById('home-odds').innerHTML = `${home.split(' ').pop()}: +130 <span class="text-[10px] opacity-50">(+2)</span>`;

            // 繪圖
            const ctx = document.getElementById('oddsChart').getContext('2d');
            if (window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'line',
                data: { 
                    labels: data.map(d => d.time), 
                    datasets: [{ label: 'Pinnacle Odds', data: data.map(d => d.odds), borderColor: '#38bdf8', borderWidth: 2, tension: 0.1, fill: false }] 
                },
                options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { y: { grid: { color: '#334155' } }, x: { grid: { color: '#334155' } } } }
            });
        };
    </script>
</body>
</html>
